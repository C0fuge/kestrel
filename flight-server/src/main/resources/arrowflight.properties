# Arrow batch size used by DuckDB Arrow export and Flight streaming.
# 65536 amortizes JNI/gRPC/callback overhead for analytical scans.
batchSize=65536

# Server defaults.
numServers=6
dataDir=/data/parquet
# Optional local data directory retained for compatibility with older deployments.
localDataDir=
port=32010
hazelcastPort=5701
# Bound each inbound Flight/gRPC message to 64 MB.
grpcMaxInboundMessageSize=67108864
# Cap Arrow buffers in this server process at 2 GiB; tune to the container memory budget.
arrowAllocatorLimitBytes=2147483648
# Maximum serialized outbound bytes queued by Flight before listener backpressure.
# 256 MB reduces stall frequency on bulk scans that produce many batches (Q1, Q18, Q21).
flightBackpressureThresholdBytes=268435456
flightListenerReadyTimeoutMs=300000

# Expose Prometheus benchmark metrics consumed by Grafana.
metricsEnabled=true

# Hadoop client I/O.
ioFileBufferSize=1048576

# Client retry and timeout settings.
client.maxRetries=3
client.retryBackoffMs=1000
# Disabled by default because Flight call deadlines include full stream processing time.
client.connectTimeoutMs=0

# Parallel Parquet footer reads and DuckDB worker tasks.
# If ioParallelism is set (> 0), it wins. Otherwise the formula applies:
# max(ioParallelismMinThreads, min(availableProcessors, ioParallelismMaxCores) * ioParallelismMultiplier)
# 0 = use formula. On a 2-vCPU CI runner this yields max(8, 2*4)=8; on 16-core server max(8,16*4)=64.
ioParallelism=0
ioParallelismMinThreads=8
ioParallelismMaxCores=16
ioParallelismMultiplier=4

# DuckDB execution.
duckDbWarmConnections=8
duckDbGroups=8
# Number of DuckDB threads per connection. Set to 1 when a Spark worker is co-located on the
# same node to avoid CPU oversubscription. Increase when Flight servers are storage-only nodes.
duckDbThreads=2
# Hard cap on DuckDB off-heap memory per connection (DuckDB SET memory_limit syntax, e.g. 2GB).
# Empty = no limit (OS provides the guardrail via container/cgroup).
duckDbMemoryLimit=
# Hand batches to Flight as DuckDB produces them. false = DuckDB buffers the whole result first.
duckDbStreamResults=true
# DuckDB's own cache of file data read through an extension (HDFS). It fills every connection up
# to duckDbMemoryLimit and stays there; the OS page cache serves repeated reads anyway.
duckDbExternalFileCache=false
# Prepared statements kept per connection; the least recently used one is closed beyond that.
duckDbStatementCacheSize=64
# Where DuckDB spills data that does not fit into duckDbMemoryLimit; every connection gets a
# subdirectory of its own. Empty = .tmp in the working directory.
duckDbTempDirectory=

# DuckDB HDFS extension. Environment variables with the same meaning still work:
# DUCKDB_HDFS_EXTENSION, DUCKDB_ALLOW_UNSIGNED_EXTENSIONS, HDFS_DEFAULT_NAMENODE,
# HDFS_HA_NAMENODES, HDFS_SHORTCIRCUIT, HDFS_DOMAIN_SOCKET_PATH.
duckDbHdfsExtension=
duckDbAllowUnsignedExtensions=
duckDbHdfsDefaultNamenode=
duckDbHdfsHaNamenodes=
duckDbHdfsShortcircuit=
duckDbHdfsDomainSocketPath=

# Logging level for SLF4J Simple. Valid: TRACE, DEBUG, INFO, WARN, ERROR, OFF.
# DEBUG shows file resolution, per-batch progress, executor pool state.
# INFO shows startup and cluster lifecycle; DEBUG adds per-query and per-batch diagnostics.
# WARN shows timeouts, retries, backpressure >100ms, stale cache entries.
logLevel=INFO

# Access token. When set, every call must carry it: "Authorization: Bearer <token>", or Basic
# authentication with any user name and the token as the password. Empty = no check.
# Prefer the FLIGHT_AUTH_TOKEN environment variable over writing the token here.
authToken=

# What a client gets for a query when it does not ask otherwise (header x-flight-result-mode):
#   complete - one endpoint with the complete answer; the receiving node runs the whole SQL in
#              DuckDB over views of all tables (any SQL DuckDB accepts; stock JDBC/ODBC/ADBC
#              clients and BI tools need this on a cluster);
#   partial  - one endpoint per node with the part computed from that node's files; the client
#              merges (the Trino connector and the Spark connector do).
resultMode=complete
# Complete-answer views show unsigned integers as the next wider signed type (uint64 as
# DECIMAL(20,0)); JDBC and ODBC have no unsigned types.
widenUnsignedTypes=true
# DuckDB may read only the data directory and its spill directory; every other file access,
# ATTACH, COPY, INSTALL and configuration changes are refused.
duckDbLockdown=true
