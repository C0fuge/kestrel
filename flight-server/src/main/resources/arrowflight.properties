# Defaults of the server. Precedence: -D system properties (every name and alias) > environment
# variables > etc/plugins/<ns>.properties (plugin keys) > this file > built-in defaults.
# Arrow batch size used by DuckDB Arrow export and Flight streaming.
# 65536 amortizes JNI/gRPC/callback overhead for analytical scans.
batchSize=65536

# Server defaults.
numServers=6
dataDir=/data/parquet
# Optional local data directory retained for compatibility with older deployments.
localDataDir=
port=32010
hazelcastPort=5701
# Bound each inbound Flight/gRPC message to 64 MB.
grpcMaxInboundMessageSize=67108864
# Cap Arrow buffers in this server process at 2 GiB; tune to the container memory budget.
arrowAllocatorLimitBytes=2147483648
# Maximum serialized outbound bytes queued by Flight before listener backpressure.
# 256 MB reduces stall frequency on bulk scans that produce many batches (Q1, Q18, Q21).
flightBackpressureThresholdBytes=268435456
flightListenerReadyTimeoutMs=300000
# Queued outbound bytes all Flight streams share (each gets budget / open streams, at least 1 MiB,
# at most flightBackpressureThresholdBytes); 0 = a quarter of the JVM's direct memory limit.
flightOutboundBudgetBytes=0
# Arrow IPC body compression of result streams: none, zstd or lz4 for calls without the
# arrow-compression header (clients ask per call with arrow-compression: zstd|lz4|none). Anything but
# none here breaks clients without the codec (the stock Flight SQL JDBC driver).
flightCompression=none
# Zstandard level (lz4 has none).
flightCompressionLevel=1
# Batches with fewer body bytes are sent plain.
flightCompressionMinBytes=65536
# Flight SQL sessions (SetSessionOptions, cookie arrow_flight_session_id; option arrow-compression):
# a session unused this long is dropped, and at most this many are kept per node.
flightSessionIdleSeconds=3600
flightSessionMax=10000

# Expose Prometheus benchmark metrics consumed by Grafana.
metricsEnabled=true

# Hadoop client I/O.
ioFileBufferSize=1048576

# Client retry and timeout settings.
client.maxRetries=3
client.retryBackoffMs=1000
# Disabled by default because Flight call deadlines include full stream processing time.
client.connectTimeoutMs=0

# Parallel Parquet footer reads and DuckDB worker tasks.
# If ioParallelism is set (> 0), it wins. Otherwise the formula applies:
# max(ioParallelismMinThreads, min(availableProcessors, ioParallelismMaxCores) * ioParallelismMultiplier)
# 0 = use formula. On a 2-vCPU CI runner this yields max(8, 2*4)=8; on 16-core server max(8,16*4)=64.
ioParallelism=0
ioParallelismMinThreads=8
ioParallelismMaxCores=16
ioParallelismMultiplier=4

# DuckDB execution.
duckDbWarmConnections=8
duckDbGroups=8
# Number of DuckDB threads per connection. Empty or 0 = a quarter of the cores, between 2 and 8
# (4 on 16 cores; see docs/dev/TUNING.md), at least 4 when dataDir is on s3/s3a/s3n/lakefs (reads
# wait on round trips). Set to 1 when a Spark worker is co-located on the same
# node to avoid CPU oversubscription. Increase (8) when Flight servers are storage-only nodes
# serving mostly heavy queries.
duckDbThreads=
# DuckDB threads of a second connection per Flight worker, used by a DoGet that starts while the
# running DoGets times duckDbThreads exceed the cores (parallel partial-mode endpoints, concurrent
# queries); a query alone keeps duckDbThreads. Opened on first use: up to one more DuckDB per worker.
# 0 = off; values not below duckDbThreads are off too (env DUCKDB_THREADS_UNDER_LOAD).
duckDbThreadsUnderLoad=0
# Streams of a node that may be inside DuckDB at once, running their query or computing their next
# batch; the others wait their turn (in arrival order). A stream waiting for its client holds no
# turn. Try cores / duckDbThreads for many parallel scans on few cores. 0 = no cap
# (env DUCKDB_PRODUCING_STREAMS).
duckDbProducingStreams=0
# Hard cap on DuckDB off-heap memory per connection (DuckDB SET memory_limit syntax, e.g. 2GB).
# Empty = no limit (OS provides the guardrail via container/cgroup).
duckDbMemoryLimit=
# Hand batches to Flight as DuckDB produces them. false = DuckDB buffers the whole result first.
duckDbStreamResults=true
# DuckDB's own cache of file data read through an extension (HDFS). It fills every connection up
# to duckDbMemoryLimit and stays there; the OS page cache serves repeated reads anyway.
duckDbExternalFileCache=false
# Prepared statements kept per connection; the least recently used one is closed beyond that.
# 0 (or 1) keeps only the statement in use: every query is prepared again.
duckDbStatementCacheSize=64
# Where DuckDB spills data that does not fit into duckDbMemoryLimit; every connection gets a
# subdirectory of its own. Empty = .tmp in the working directory.
duckDbTempDirectory=
# Cap of each connection's spill directory, e.g. 20GiB (env DUCKDB_MAX_TEMP_SIZE). Per connection:
# the node may spill up to this times its live connections. Empty = DuckDB's own cap (90 % of the
# free disk space, for every connection).
duckDbMaxTempSize=
# false lets DuckDB return the rows of a query without ORDER BY in any order, so parallel scan
# threads need not wait for each other (env DUCKDB_PRESERVE_INSERTION_ORDER). Empty = true.
duckDbPreserveInsertionOrder=
# How far a streamed result may run ahead of a slow Flight consumer, per query, e.g. 64MiB (env
# DUCKDB_STREAMING_BUFFER_SIZE). Empty = DuckDB's own (about 1 MB).
duckDbStreamingBufferSize=

# DuckDB HDFS extension. Environment variables with the same meaning still work:
# DUCKDB_HDFS_EXTENSION, DUCKDB_ALLOW_UNSIGNED_EXTENSIONS, HDFS_DEFAULT_NAMENODE,
# HDFS_HA_NAMENODES, HDFS_SHORTCIRCUIT, HDFS_DOMAIN_SOCKET_PATH.
duckDbHdfsExtension=
duckDbAllowUnsignedExtensions=
duckDbHdfsDefaultNamenode=
duckDbHdfsHaNamenodes=
duckDbHdfsShortcircuit=
duckDbHdfsDomainSocketPath=
# DataNode connect / read timeouts in ms, set in DuckDB as hdfs_connect_timeout_ms /
# hdfs_read_timeout_ms (hadoopfs extension built with the timeout patch, version 51b7220-afc2).
# After a read timeout the block is read from the next replica. Defaults 3000 / 10000; they win
# over input.connect.timeout / input.read.timeout in LIBHDFS3_CONF. 0 = not set by the server
# (LIBHDFS3_CONF value, else the extension's 5000 / 15000). An extension without these settings
# logs one warning and keeps its own timeouts. (Environment: HDFS_CONNECT_TIMEOUT_MS /
# HDFS_READ_TIMEOUT_MS.)
#duckDbHdfsConnectTimeoutMs=3000
#duckDbHdfsReadTimeoutMs=10000
# NameNode RPC timeouts have no DuckDB setting: set them in the LIBHDFS3_CONF file. libhdfs3's
# defaults (connect 600 s, read / write / call 3600 s) let a query hang for minutes when the active
# NameNode host disappears; with rpc.client.connect.timeout=5000, rpc.client.read.timeout=15000,
# rpc.client.write.timeout=15000, rpc.client.timeout=20000 and rpc.client.connect.retry=2 a query
# waits only for the failover (secure HA stand, 2026-10-25). The server warns at startup on HDFS
# when one of the four timeouts is unset or longer than a minute.
# Kerberos HDFS: the hadoopfs extension (libhdfs3) reads only a ticket cache, never a keytab. With
# a principal and a keytab set, the server logs in from the keytab (the JVM's krb5.conf), writes the
# ticket-granting ticket as a MIT file cache (owner-only) and replaces it at 80 % of its lifetime,
# so no external kinit is needed. The cache defaults to the one the extension reads: LIBHDFS3_CONF's
# hadoop.security.kerberos.ticket.cache.path, else KRB5CCNAME, else /tmp/krb5cc_<uid>; a FILE:
# cache only. A failed first login stops the start; a failed renewal is retried every minute.
#hdfsKerberosPrincipal=flight/host.example.com@EXAMPLE.COM
#hdfsKerberosKeytab=/etc/security/keytabs/flight.keytab
#hdfsKerberosTicketCache=/run/flight/krb5cc

# S3 data directory (dataDir=s3://bucket/prefix; s3a:// and s3n:// mean the same). The Java client
# lists the prefix and reads Parquet footers; DuckDB reads the data through its httpfs extension.
# Read by the s3 plugin: plugins/s3 under arrowflight.plugins.dir (FLIGHT_PLUGINS_DIR, default
# ../plugins beside the jar). lakeFS (dataDir=lakefs://repository/ref/prefix) is the lakefs
# plugin with its own keys arrowflight.lakefs.* (endpoint, apiEndpoint, ...; FLIGHT_LAKEFS_*).
# Endpoint URL, empty = AWS in s3Region. The scheme decides TLS. FLIGHT_S3_ENDPOINT also works.
s3Endpoint=
# Signing region; for Ceph RGW the zonegroup name. FLIGHT_S3_REGION also works.
s3Region=us-east-1
# path (host/bucket/key) or vhost (bucket.host/key, needs wildcard DNS).
s3UrlStyle=path
# PEM file with the only CAs trusted for TLS, by the Java client and by DuckDB (ca_cert_file).
# Empty = the system CAs.
s3CaFile=
# false accepts any certificate; for lab use only, logged as a warning.
s3VerifyTls=true
# Credentials never come from this file or -D properties (both are a startup error). Either set
# FLIGHT_S3_ACCESS_KEY and FLIGHT_S3_SECRET_KEY (and FLIGHT_S3_SESSION_TOKEN) in the environment,
# or name a properties file with accessKey=, secretKey= (sessionToken=) that is not world-readable.
# AWS_* variables are ignored. Use a read-only key restricted to the data directory's prefix.
s3CredentialsFile=
# How long a listing of the data directory is used; after that it is refreshed in the background
# and queries keep the previous listing until the new one is complete. 0 = list on every use.
s3ListingTtlSeconds=30
# HTTP connections of the Java client. 0 = ioParallelism.
s3MaxConnections=0
# DuckDB httpfs extension file, required for S3; it must match the DuckDB version
# (v1.5.6/linux_amd64/httpfs.duckdb_extension). DUCKDB_HTTPFS_EXTENSION also works.
duckDbHttpfsExtension=
# DuckDB keeps Parquet footers and HTTP metadata of S3 files between queries of a connection.
duckDbS3MetadataCache=true
# DuckDB keeps its S3 connections open and reads later ranges and queries over them
# (httpfs_connection_caching). With false, at 4+ DuckDB threads httpfs opens a new connection for
# most range reads, and each closed connection holds its local port 60 s (TIME_WAIT); many
# concurrent queries then run out of local ports ("Could not establish connection"): then set
# net.ipv4.tcp_tw_reuse=1 in the server's network namespace and widen
# net.ipv4.ip_local_port_range (the server WARNs at startup while tcp_tw_reuse is not 1).
#arrowflight.s3.connectionCaching=true
# Further S3 stores for catalog roots outside the data directory (an Iceberg warehouse or Hive
# tables in another bucket, on another endpoint, with other credentials): comma separated names
# (lower case letters and digits), each with its own root and settings below arrowflight.s3.<name>.
# endpoint, region, urlStyle and the credentials (FLIGHT_S3_<NAME>_ACCESS_KEY / _SECRET_KEY /
# _SESSION_TOKEN or arrowflight.s3.<name>.credentialsFile) are the store's own; caFile, verifyTls,
# metadataCache, listingTtlSeconds, maxConnections, the http retries and connectionCaching default
# to the values above. A catalog root
# below a store's root reads through that store (longest root wins; the data directory first).
# Each store is listed as a whole when a catalog lists it: keep the root narrow.
#arrowflight.s3.stores=wh
#arrowflight.s3.wh.root=s3://warehouse/iceberg
#arrowflight.s3.wh.endpoint=https://s3.other.example:9000

# Logging level for SLF4J Simple. Valid: TRACE, DEBUG, INFO, WARN, ERROR, OFF.
# DEBUG shows file resolution, per-batch progress, executor pool state.
# INFO shows startup and cluster lifecycle; DEBUG adds per-query and per-batch diagnostics.
# WARN shows timeouts, retries, backpressure >100ms, stale cache entries.
logLevel=INFO

# Access token. When set, every call must carry it: "Authorization: Bearer <token>", or Basic
# authentication with any user name and the token as the password. Empty = no check.
# Prefer the FLIGHT_AUTH_TOKEN environment variable over writing the token here.
authToken=

# What a client gets for a query when it does not ask otherwise (header x-flight-result-mode):
#   complete - one endpoint with the complete answer; the receiving node runs the whole SQL in
#              DuckDB over views of all tables (any SQL DuckDB accepts; stock JDBC/ODBC/ADBC
#              clients and BI tools need this on a cluster);
#   partial  - one endpoint per node with the part computed from that node's files; the client
#              merges (the Trino connector and the Spark connector do).
resultMode=complete
# Partial results on a cluster: other live nodes listed after the planned node of every endpoint,
# which a client tries in order when the planned node cannot be reached (the node is gone, its
# port refuses connections). Only nodes that can read every file of the endpoint are listed: on
# HDFS and S3 any node, on local disks only nodes with replicas of the files. A node that runs an
# endpoint planned for another node takes over its load accounting. 0 = planned node only.
# (Environment: FLIGHT_ENDPOINT_BACKUP_LOCATIONS.)
endpointBackupLocations=2
# Partial results: maximum endpoints per node and query. The node's files are split into groups of
# similar size, each an endpoint with its own backup locations, which a client reads in parallel.
# Queries that need every row in one place (OFFSET, HAVING, DISTINCT aggregates) and joins keep one
# endpoint. Default 1. (Environment: FLIGHT_ENDPOINTS_PER_SERVER.)
#endpointsPerServer=1
# Location of the endpoints of metadata calls (catalogs, schemas, tables, SqlInfo, type info):
#   none       - no location; the client reads them over the connection it already has, whatever
#                name or address it reached this server by (default; 1.4-1.6x faster JDBC metadata
#                in plaintext, 3.2x with TLS, because the stock driver opens a new connection for
#                every advertised location)
#   advertised - this server's URI (--localhost and port, grpc+tcp or grpc+tls); every client
#                must be able to reach that address
# (Environment: FLIGHT_METADATA_ENDPOINT_LOCATION.)
#metadataEndpointLocation=none
# Both result modes show and stream unsigned integers as the next wider signed type (uint64 as
# DECIMAL(20,0)); JDBC and ODBC have no unsigned types.
widenUnsignedTypes=true
# DuckDB may read only the data directory and its spill directory; every other file access,
# ATTACH, COPY, INSTALL and configuration changes are refused.
duckDbLockdown=true

# Table catalogs besides the data directory, comma separated; the data directory is always one.
# iceberg-hadoop and iceberg-rest are the iceberg plugin (plugins/iceberg), hive the hive plugin
# (plugins/hive). FLIGHT_CATALOG also works.
#catalog=directory,iceberg-hadoop
# iceberg-hadoop: a warehouse directory in the Hadoop layout (<namespace>/<table>/metadata/).
#arrowflight.iceberg-hadoop.warehouse=hdfs://namenode/warehouse
# iceberg-rest: an Iceberg REST catalog (Gravitino: http://host:9001/iceberg). roots = where its
# tables lie (read by the server's stores and DuckDB). Credentials only as FLIGHT_ICEBERG_REST_TOKEN
# or FLIGHT_ICEBERG_REST_CREDENTIAL (client_id:secret, OAuth2), or tokenFile/credentialFile.
#arrowflight.iceberg-rest.uri=http://gravitino:9001/iceberg
#arrowflight.iceberg-rest.warehouse=
#arrowflight.iceberg-rest.roots=s3://lake/warehouse
# Both: schemaPrefix (text before namespace names), namespaces (filter), namesTtlSeconds (30),
# metadataTtlMillis (5000), planThreads (4). DuckDB needs the iceberg and avro extensions:
#duckDbIcebergExtension=
#duckDbAvroExtension=
# hive: a Hive Metastore (plugins/hive) over Thrift, without authentication or Kerberos. Databases
# are schemas, Parquet tables are tables (other formats, views and ACID tables are skipped, logged);
# partitions and their locations come from the metastore. Every table and partition location must
# lie under roots, else the table is hidden (WARN). Iceberg tables of the metastore are read through
# the iceberg plugin when it is installed (then DuckDB needs iceberg + avro; icebergTables=skip if not).
#catalog=directory,hive
#arrowflight.hive.uris=thrift://hms:9083
#arrowflight.hive.roots=hdfs://namenode/warehouse
# Also: schemaPrefix, databases (filter), namesTtlSeconds (60), metadataTtlSeconds (30, partitions
# and file lists), connectTimeoutMillis (10000), socketTimeoutMillis (60000), maxConnections (4),
# framedTransport (false), recursiveDirectories (false), partitionBatchSize (500), listThreads (8),
# icebergTables (auto | require | skip), defaultPartitionName (__HIVE_DEFAULT_PARTITION__),
# orcTables (false; true shows ORC tables, read by the plugin and handed to DuckDB as Arrow streams,
# filters skip stripes and row groups; transactional ORC tables stay skipped).
# Kerberos metastore (hive.metastore.sasl.enabled): SASL/GSSAPI, the JVM's krb5.conf
# (-Djava.security.krb5.conf); _HOST is the host of each URI. Login from a keytab, or from the ticket
# cache (KRB5CCNAME, clientTicketCache) that an external kinit keeps fresh; renewed before expiry.
# saslQop (auth-conf,auth-int,auth: the strongest the metastore offers). No framed transport.
#arrowflight.hive.authentication=kerberos
#arrowflight.hive.metastorePrincipal=hive/_HOST@EXAMPLE.COM
#arrowflight.hive.clientPrincipal=flight/host.example.com@EXAMPLE.COM
#arrowflight.hive.clientKeytab=/etc/security/keytabs/flight.keytab
# Catalog roots on local paths are read by the planning node only, unless every node mounts them.
#arrowflight.catalog.localRootsShared=false
