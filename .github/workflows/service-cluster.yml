# SERVICE MATRIX, cluster part (lane 3; only lane 3 edits this file): a 3-node cluster of the server
# on real storage services, checked end to end with the ADBC Flight SQL driver (Go).
#
# Stores: HDFS (apache/hadoop: a NameNode and 3 DataNodes; each server runs in its DataNode's
# network namespace, as server-node-N of docker-compose.ci.yml, with the DataNode's domain socket
# mounted for short-circuit reads when the image's native Hadoop library loads), HDFS HA (hdfs-ha: the
# same with an HA nameservice ns1 of two NameNodes, nn1 standby / nn2 active, shared edits, manual
# failover; data dir hdfs://ns1/data, so the servers' Java client and hadoopfs must fail over to nn2;
# in the loss cell the NameNodes also fail over nn2 -> nn1 and back under load; the notes count the reads
# each NameNode answered per failover window, D13 b) and S3 (a MinIO
# container; moto when no MinIO image can be pulled - the summary names the service). Data: TPC-H
# SF<sf> as Parquet (lineitem and orders in <files> files), read by the hadoopfs / httpfs DuckDB
# extensions of ci-assets (HDFS: hadoopfs from -Darrowflight.duckdb.extensionDir only, as the
# maintainer's cluster runs; the HDFS notes have each DataNode's TCP block reads from JMX). Cells per store:
# balanced, speed (-DresourceProfile=speed), speed-dc
# (speed + -DdistributedComplete=true), and loss (speed-dc under a load of 3 clients while the third
# server is killed: every answer exact or a retryable UNAVAILABLE whose retry is exact, never a
# partial answer; one more client streams a merged scan of lineitem slowly, so the kill lands inside
# a merged answer and exercises the "peer lost ... retry" UNAVAILABLE, D13 c). Each non-loss cell runs the 22 queries (answers compared with in-process DuckDB
# over the same files, tools/ci/service-cluster-data.py), Flight SQL metadata and a prepared query
# (tools/ci/service-cluster-check.py). The job summary has the table cell -> pass/fail + first error.
#
# Server: input "server" = a kestrel pre-release (tag server-1.0.0-<sha12> or just <sha12>), else
# built from the checked-out commit (push runs build).
name: Service cluster

on:
  workflow_dispatch:
    inputs:
      server:
        description: "kestrel pre-release (server-1.0.0-<sha12> or <sha12>); empty = build this commit"
        type: string
        default: ""
      sf:
        description: "TPC-H scale factor"
        type: string
        default: "1"
      files:
        description: "Parquet files of lineitem and orders"
        type: string
        default: "6"
  push:
    branches: [main]
    paths:
      - .github/workflows/service-cluster.yml
      - tools/ci/service-cluster-*.py

permissions:
  contents: read

concurrency:
  group: service-cluster-${{ github.ref }}-${{ inputs.server || 'build' }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --errors --no-transfer-progress
  LC_ALL: C.UTF-8
  DUCKDB_VERSION: v1.5.6
  HADOOP_IMAGE: apache/hadoop:3.4.1

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      server: ${{ steps.server.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: inputs.server == ''
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Server (pre-release or this commit)
        id: server
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ inputs.server }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/in/app"; mkdir -p "$out/plugins"
          if [ -n "$SERVER" ]; then
            tag=$SERVER; [[ "$tag" == server-* ]] || tag="server-1.0.0-$tag"
            [[ "$tag" =~ ^server-[0-9A-Za-z.-]+$ ]] || { echo "bad server id: $SERVER"; exit 1; }
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/rel" \
              --pattern '*-linux.jar' --pattern 'flight-server-libs-*.tar.zst' --pattern 'flight-plugins-*.tar.zst'
            cp "$RUNNER_TEMP"/rel/*-linux.jar "$out/arrow-flight-server.jar"
            tar --zstd -xf "$RUNNER_TEMP"/rel/flight-server-libs-*.tar.zst -C "$out"
            tar --zstd -xf "$RUNNER_TEMP"/rel/flight-plugins-*.tar.zst -C "$out"
            echo "server=$tag" >> "$GITHUB_OUTPUT"
          else
            ./mvnw install -pl flight-server,flight-plugin-s3 -am -DskipTests -Dcheckstyle.skip -Dspotbugs.skip
            cp flight-server/target/arrow-flight-server-1.0.0-shaded.jar "$out/arrow-flight-server.jar"
            cp -r flight-server/target/libs "$out/"
            cp -r flight-plugin-s3/target/plugin/s3 "$out/plugins/"
            echo "server=build of $(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          fi
          ls "$out" "$out/plugins"; du -sh "$out"

      - name: DuckDB httpfs and hadoopfs extensions (ci-assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download ci-assets --repo "$GITHUB_REPOSITORY" \
            --pattern "duckdb-extensions-${DUCKDB_VERSION}.tar.zst" --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/all-ext" "$RUNNER_TEMP/in/ext"
          tar --zstd -xf "$RUNNER_TEMP/duckdb-extensions-${DUCKDB_VERSION}.tar.zst" -C "$RUNNER_TEMP/all-ext"
          tools/ci/hadoopfs-pinned.sh "$RUNNER_TEMP/all-ext"  # hadoopfs 51b7220-afc6 instead of the set's afc3
          for name in httpfs hadoopfs; do
            f=$(find "$RUNNER_TEMP/all-ext" -path "*${DUCKDB_VERSION}/linux_amd64/${name}.duckdb_extension" | head -n 1)
            test -n "$f" || { echo "no ${name} for ${DUCKDB_VERSION} in ci-assets"; exit 1; }
            cp "$f" "$RUNNER_TEMP/in/ext/${name}.duckdb_extension"
          done
          ls -l "$RUNNER_TEMP/in/ext"
          # The layout of arrowflight.duckdb.extensionDir (<dir>/<version>/<platform>/), as the maintainer's
          # cluster runs it: the HDFS cells load hadoopfs from there only (the 2026-11-02 bug: hadoopfs was not
          # resolved from extensionDir, every HDFS query refused).
          mkdir -p "$RUNNER_TEMP/in/extdir/${DUCKDB_VERSION}/linux_amd64"
          cp "$RUNNER_TEMP"/in/ext/*.duckdb_extension "$RUNNER_TEMP/in/extdir/${DUCKDB_VERSION}/linux_amd64/"

      - name: TPC-H SF${{ inputs.sf || '1' }} and the reference answers
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q duckdb==1.5.6 pyarrow==26.0.0
          "$RUNNER_TEMP/py/bin/python" -I tools/ci/service-cluster-data.py "$RUNNER_TEMP/in" "${{ inputs.sf || '1' }}" "${{ inputs.files || '6' }}"
          du -sh "$RUNNER_TEMP/in/data"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-cluster-input
          path: ${{ runner.temp }}/in
          compression-level: 0
          retention-days: 1

  cell:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        store: [hdfs, hdfs-ha, s3]
        cell: [balanced, speed, speed-dc, loss]
    name: ${{ matrix.store }} ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: service-cluster-input
          path: ${{ runner.temp }}/in

      - name: Client and server image
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q pyarrow==26.0.0 adbc-driver-flightsql==1.13.0 adbc-driver-manager==1.13.0
          # The hadoopfs build links libssl.so.1.1: an Ubuntu 20.04 base, the runner's JDK 21 mounted.
          tools/ci/server-image.sh "$RUNNER_TEMP/img" sc-server libxml2 libkrb5-3 libgsasl7 libuuid1
          docker run --rm -v "$RUNNER_TEMP/in/ext:/ext:ro" sc-server bash -c 'ldd /ext/hadoopfs.duckdb_extension | grep "not found" || echo "hadoopfs: all libraries found"'
          docker network create --subnet 172.30.0.0/24 sc > /dev/null

      - name: Run the cell
        env:
          STORE: ${{ matrix.store }}
          CELL: ${{ matrix.cell }}
        run: |
          set +e -u
          in="$RUNNER_TEMP/in"; res="$RUNNER_TEMP/result.txt"; notes="$RUNNER_TEMP/notes.txt"; : > "$notes"
          finish() { # status, detail
            printf '%s|%s|%s|%s\n' "$STORE" "$CELL" "$1" "$(echo "$2" | head -n 1 | tr '|' '/' | cut -c1-300)" > "$res"
            for i in 1 2 3; do docker logs "srv$i" > "$RUNNER_TEMP/srv$i.log" 2>&1; docker logs "dn$i" > "$RUNNER_TEMP/dn$i.log" 2>&1 || rm -f "$RUNNER_TEMP/dn$i.log"; done
            for c in nn nn1 nn2; do docker logs "$c" > "$RUNNER_TEMP/$c.log" 2>&1 || rm -f "$RUNNER_TEMP/$c.log"; done
            [ "$1" = pass ]; exit $?
          }
          note() { echo "$*" | tee -a "$notes"; }
          nodes="172.30.0.11:32010,172.30.0.12:32010,172.30.0.13:32010"
          common=(-v "$in/app:/app:ro" -v "$in/ext:/ext:ro" -v "$in/extdir:/extdir:ro" -v "$JAVA_HOME_21_X64:/jdk:ro"
            -v "$RUNNER_TEMP/conf:/conf:ro" -e FLIGHT_ALLOW_INSECURE=true -e DUCKDB_ALLOW_UNSIGNED_EXTENSIONS=true
            -e FLIGHT_PLUGINS_DIR=/app/plugins)
          mkdir -p "$RUNNER_TEMP/conf"
          xml() { # key value ...: a Hadoop configuration file
            echo '<?xml version="1.0"?>'; echo '<configuration>'
            while [ $# -ge 2 ]; do printf '  <property><name>%s</name><value>%s</value></property>\n' "$1" "$2"; shift 2; done
            echo '</configuration>'
          }
          xml > "$RUNNER_TEMP/conf/hdfs-site.xml"

          if [[ $STORE == hdfs* ]]; then
            hcfg=(-e HDFS-SITE.XML_dfs.replication=1
              -e HDFS-SITE.XML_dfs.permissions.enabled=false -e HDFS-SITE.XML_dfs.namenode.rpc-bind-host=0.0.0.0
              -e HDFS-SITE.XML_dfs.namenode.http-bind-host=0.0.0.0 -e HDFS-SITE.XML_dfs.datanode.data.dir=/tmp/hdfs/dn
              -e HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check=false)
            # The servers' client configuration (classpath /conf and LIBHDFS3_CONF: one file for both).
            cconf=()
            if [ "$STORE" = hdfs-ha ]; then
              # HA nameservice ns1 as in the core lane's service-hdfs-cell.sh: nn1 (172.30.0.9) standby, nn2
              # (172.30.0.10) active, so every client tries the standby first and must fail over.
              cconf=(fs.defaultFS hdfs://ns1 dfs.nameservices ns1 dfs.ha.namenodes.ns1 nn1,nn2
                dfs.namenode.rpc-address.ns1.nn1 172.30.0.9:8020 dfs.namenode.rpc-address.ns1.nn2 172.30.0.10:8020
                dfs.client.failover.proxy.provider.ns1 org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider)
              hcfg+=(-e CORE-SITE.XML_fs.defaultFS=hdfs://ns1 -e HDFS-SITE.XML_dfs.nameservices=ns1
                -e HDFS-SITE.XML_dfs.ha.namenodes.ns1=nn1,nn2
                -e HDFS-SITE.XML_dfs.namenode.rpc-address.ns1.nn1=172.30.0.9:8020
                -e HDFS-SITE.XML_dfs.namenode.rpc-address.ns1.nn2=172.30.0.10:8020
                -e HDFS-SITE.XML_dfs.namenode.http-address.ns1.nn1=172.30.0.9:9870
                -e HDFS-SITE.XML_dfs.namenode.http-address.ns1.nn2=172.30.0.10:9870
                -e HDFS-SITE.XML_dfs.namenode.shared.edits.dir=file:///hd/shared
                -e HDFS-SITE.XML_dfs.ha.automatic-failover.enabled=false
                -e "HDFS-SITE.XML_dfs.ha.fencing.methods=shell(/bin/true)"
                -e HDFS-SITE.XML_dfs.client.failover.proxy.provider.ns1=org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider
                -e HDFS-SITE.XML_dfs.namenode.name.dir=/hd/name)
              nnc=nn2; dataDir=hdfs://ns1/data
            else
              hcfg+=(-e CORE-SITE.XML_fs.defaultFS=hdfs://172.30.0.10:8020 -e HDFS-SITE.XML_dfs.namenode.name.dir=/tmp/hdfs/nn)
              nnc=nn; dataDir=hdfs://172.30.0.10:8020/data
            fi
            sc=off
            if docker run --rm "$HADOOP_IMAGE" hadoop checknative 2>&1 | grep -E '^hadoop: +true'; then sc=on; fi
            if [ "$STORE" = hdfs-ha ]; then
              note "HDFS $HADOOP_IMAGE, HA nameservice ns1 (nn1 standby / nn2 active, manual failover) + 3 DataNodes, replication 1, short-circuit configured: $sc"
              # nn1 formats its name directory and the shared edits, waits until they are copied for nn2, then runs.
              hd=/srv/sc-hd; sudo rm -rf "$hd"; sudo install -d -o 1000 -g 1000 -m 755 "$hd" "$hd/nn1" "$hd/shared"
              docker run -d --name nn1 --network sc --ip 172.30.0.9 --hostname nn1 "${hcfg[@]}" -v "$hd/nn1:/hd/name" \
                -v "$hd/shared:/hd/shared" "$HADOOP_IMAGE" bash -c 'hdfs namenode -format -nonInteractive -force > /tmp/format.log 2>&1 \
                  || { cat /tmp/format.log; exit 1; }; touch /hd/name/.formatted; while [ ! -f /hd/name/.go ]; do sleep 1; done; exec hdfs namenode' > /dev/null
              for _ in $(seq 120); do [ -f "$hd/nn1/.formatted" ] && break; [ "$(docker inspect -f '{{.State.Running}}' nn1)" = true ] || break; sleep 1; done
              [ -f "$hd/nn1/.formatted" ] || { docker logs nn1 2>&1 | tail -n 30; finish fail "NameNode format failed: $(docker logs nn1 2>&1 | grep -m 1 -E 'Exception|ERROR' | cut -c1-200)"; }
              sudo cp -a "$hd/nn1" "$hd/nn2"
              docker run -d --name nn2 --network sc --ip 172.30.0.10 --hostname nn2 "${hcfg[@]}" -v "$hd/nn2:/hd/name" \
                -v "$hd/shared:/hd/shared" "$HADOOP_IMAGE" hdfs namenode > /dev/null
              sudo touch "$hd/nn1/.go"
            else
              note "HDFS $HADOOP_IMAGE, NameNode + 3 DataNodes, replication 1, short-circuit configured: $sc"
              docker run -d --name nn --network sc --ip 172.30.0.10 --hostname nn "${hcfg[@]}" "$HADOOP_IMAGE" \
                bash -c 'hdfs namenode -format -nonInteractive -force > /tmp/format.log 2>&1 && exec hdfs namenode' > /dev/null
            fi
            for i in 1 2 3; do
              scfg=()
              if [ "$sc" = on ]; then
                sudo install -d -o 1000 -g 1000 -m 755 "/srv/sc-sock/dn$i"
                scfg=(-v "/srv/sc-sock/dn$i:/var/run/hdfs-sockets" -e HDFS-SITE.XML_dfs.domain.socket.path=/var/run/hdfs-sockets/dn
                  -e HDFS-SITE.XML_dfs.client.read.shortcircuit=true)
              fi
              docker run -d --name "dn$i" --network sc --ip "172.30.0.1$i" --hostname "node$i" "${hcfg[@]}" "${scfg[@]}" \
                "$HADOOP_IMAGE" hdfs datanode > /dev/null
            done
            haState() { echo "nn1=$(docker exec nn2 hdfs haadmin -getServiceState nn1 2>&1 | tail -n 1) nn2=$(docker exec nn2 hdfs haadmin -getServiceState nn2 2>&1 | tail -n 1)"; }
            if [ "$STORE" = hdfs-ha ]; then
              for _ in $(seq 120); do
                docker exec nn2 hdfs haadmin -getServiceState nn2 > /dev/null 2>&1 \
                  && docker exec nn2 hdfs haadmin -getServiceState nn1 > /dev/null 2>&1 && break
                sleep 1
              done
              docker exec nn2 hdfs haadmin -transitionToActive nn2 2>&1 | tail -n 3
              state=$(haState); note "HA states: $state"
              [[ $state == *"nn1=standby"* && $state == *"nn2=active"* ]] || { docker logs nn2 2>&1 | tail -n 30; finish fail "HA transition failed: $state"; }
            fi
            for _ in $(seq 120); do
              report=$(docker exec "$nnc" hdfs dfsadmin -report 2>/dev/null)
              [[ $report == *'Live datanodes (3)'* && $report != *'Safe mode is ON'* ]] && break
              sleep 1
            done
            [[ $report == *'Live datanodes (3)'* ]] || { docker logs "$nnc" 2>&1 | tail -n 20; docker logs dn1 2>&1 | tail -n 20; finish fail "HDFS did not come up with 3 DataNodes"; }
            docker cp "$in/data" "$nnc:/tmp/upload" > /dev/null
            docker exec "$nnc" bash -c 'hdfs dfs -mkdir -p /data && hdfs dfs -put /tmp/upload/tpch /data/' || finish fail "HDFS upload failed"
            docker exec "$nnc" hdfs fsck /data/tpch/lineitem -files -blocks -locations 2>/dev/null | grep -oE 'DatanodeInfoWithStorage\[172\.30\.0\.1[1-3]' | sort | uniq -c | sed 's/^/lineitem blocks on /'
            if [ "$sc" = on ]; then
              # D13 (a1): does this layout support short-circuit at all? The Java client inside dn1 writes a file
              # (first replica local), then reads it back; no new READ_BLOCK on dn1 = it read short-circuit.
              rbo() { curl -fsS --max-time 5 http://172.30.0.11:9864/jmx 2>/dev/null | grep -oE '"ReadBlockOpNumOps" : [0-9]+' | grep -oE '[0-9]+$' | head -n 1; }
              docker exec dn1 bash -c 'head -c 4000000 /dev/urandom > /tmp/sc-probe && hdfs dfs -put -f /tmp/sc-probe /sc-probe' > /dev/null 2>&1
              probeLoc=$(docker exec "$nnc" hdfs fsck /sc-probe -files -blocks -locations 2>/dev/null | grep -oE 'DatanodeInfoWithStorage\[172\.30\.0\.1[1-3]' | sort -u | tr '\n' ' ')
              before=$(rbo)
              probeBytes=$(docker exec dn1 bash -c 'hdfs dfs -cat /sc-probe 2> /dev/null | wc -c')
              after=$(rbo)
              if [ "$probeBytes" != 4000000 ]; then probe="read failed ($probeBytes bytes)"
              elif [ -n "$before" ] && [ "$before" = "$after" ]; then probe="short-circuit (no READ_BLOCK)"
              else probe="TCP (READ_BLOCK $before -> $after)"; fi
              note "short-circuit probe (Java client in dn1, block on ${probeLoc:-?}): $probe"
              docker exec "$nnc" hdfs dfs -rm -skipTrash /sc-probe > /dev/null 2>&1
              cconf+=(dfs.client.read.shortcircuit true dfs.domain.socket.path /var/run/hdfs-sockets/dn)
            fi
            xml "${cconf[@]}" > "$RUNNER_TEMP/conf/hdfs-site.xml"
            netOf() { echo "--network container:dn$1"; }
            sockOf() { [ "$sc" = on ] && echo "-v /srv/sc-sock/dn$1:/var/run/hdfs-sockets"; }
            storeEnv=(-e LIBHDFS3_CONF=/conf/hdfs-site.xml)
            # hadoopfs only through the extension directory (no DUCKDB_HDFS_EXTENSION), as on the maintainer's cluster.
            extOpts="-Darrowflight.duckdb.extensionDir=/extdir"
          else
            key=$(openssl rand -hex 8); secret=$(openssl rand -hex 16); echo "::add-mask::$secret"
            s3=""
            for image in minio/minio:RELEASE.2025-09-07T16-13-09Z pgsty/minio:latest cgr.dev/chainguard/minio:latest; do
              if docker pull -q "$image" > /dev/null 2>&1 \
                  && docker run -d --name s3 --network sc --ip 172.30.0.20 -e MINIO_ROOT_USER="$key" -e MINIO_ROOT_PASSWORD="$secret" \
                    "$image" server /data --address :9000 > /dev/null; then
                for _ in $(seq 30); do curl -fsS -o /dev/null http://172.30.0.20:9000/minio/health/live && break; sleep 1; done
                if curl -fsS -o /dev/null http://172.30.0.20:9000/minio/health/live; then s3="MinIO ($image)"; break; fi
                docker logs s3 2>&1 | tail -n 5; docker rm -f s3 > /dev/null
              fi
            done
            if [ -z "$s3" ]; then
              docker run -d --name s3 --network sc --ip 172.30.0.20 python:3.12-slim \
                bash -c 'pip install -q "moto[server]==5.2.5" && exec moto_server -H 0.0.0.0 -p 9000' > /dev/null
              for _ in $(seq 120); do curl -fsS -o /dev/null http://172.30.0.20:9000/ && break; sleep 1; done
              s3="moto 5.2.5 (no MinIO image could be pulled)"
            fi
            note "S3: $s3"
            export AWS_ACCESS_KEY_ID=$key AWS_SECRET_ACCESS_KEY=$secret AWS_DEFAULT_REGION=us-east-1
            aws --endpoint-url http://172.30.0.20:9000 s3 mb s3://lake > /dev/null || finish fail "S3 bucket not created ($s3)"
            aws --endpoint-url http://172.30.0.20:9000 s3 cp --recursive --quiet "$in/data" s3://lake/data/ || finish fail "S3 upload failed"
            dataDir=s3://lake/data
            netOf() { echo "--network sc --ip 172.30.0.1$1"; }
            sockOf() { :; }
            extOpts=""
            storeEnv=(-e DUCKDB_HTTPFS_EXTENSION=/ext/httpfs.duckdb_extension
              -e FLIGHT_S3_ENDPOINT=http://172.30.0.20:9000 -e FLIGHT_S3_URL_STYLE=path
              -e FLIGHT_S3_ACCESS_KEY="$key" -e FLIGHT_S3_SECRET_KEY="$secret")
          fi

          case "$CELL" in
            balanced) opts="" ;;
            speed) opts="-DresourceProfile=speed" ;;
            *) opts="-DresourceProfile=speed -DdistributedComplete=true" ;;
          esac
          note "server ${{ needs.prepare.outputs.server }}, options: ${opts:-(defaults)} -DendpointsPerServer=2 ${extOpts:-DUCKDB_HTTPFS_EXTENSION}; 3 nodes, 1 CPU / 3 GB each"
          for i in 1 2 3; do
            # shellcheck disable=SC2046
            docker run -d --name "srv$i" $(netOf "$i") $(sockOf "$i") --cpus=1 --memory=3g "${common[@]}" "${storeEnv[@]}" \
              sc-server /jdk/bin/java -Xmx1g -XX:MaxDirectMemorySize=1g --add-opens=java.base/java.lang=ALL-UNNAMED \
              --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED \
              --add-opens=java.base/sun.nio.ch=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true \
              -Dhazelcast.phone.home.enabled=false -DnumServers=3 -DendpointsPerServer=2 $opts $extOpts \
              -cp "/conf:/app/arrow-flight-server.jar:/app/libs/*" pro.surpin.data.arrowflight.server.HadoopArrowFlightServer \
              --data-dir "$dataDir" --localhost "172.30.0.1$i" --port 32010 --hazelcast-port 5701 \
              --hosts 172.30.0.11:5701,172.30.0.12:5701,172.30.0.13:5701 --metrics-enabled false > /dev/null
          done
          for i in 1 2 3; do
            for _ in $(seq 180); do
              docker logs "srv$i" 2>&1 | grep -q 'Server Arrow Flight SQL started' && break
              [ "$(docker inspect -f '{{.State.Running}}' "srv$i")" = true ] || break
              sleep 1
            done
            if ! docker logs "srv$i" 2>&1 | grep -q 'Server Arrow Flight SQL started'; then
              docker logs "srv$i" 2>&1 | tail -n 40
              finish fail "node $i did not start: $(docker logs "srv$i" 2>&1 | grep -m 1 -E 'Exception|ERROR' | cut -c1-250)"
            fi
          done
          sleep 5
          py="$RUNNER_TEMP/py/bin/python"
          if [ "$CELL" = loss ]; then
            "$py" -I tools/ci/service-cluster-check.py loss "$nodes" "$in" 60 3 > "$RUNNER_TEMP/client.log" 2>&1 &
            client=$!
            for _ in $(seq 60); do grep -q '^load start' "$RUNNER_TEMP/client.log" && break; sleep 1; done
            # D13 (b): client reads each NameNode answered, snapshots at each failover (service-cluster-check.py nnreads).
            nnSnap() { if [ "$STORE" = hdfs-ha ]; then "$py" -I tools/ci/service-cluster-check.py nnsnap 172.30.0.9:9870,172.30.0.10:9870; fi; }
            snap0=$(nnSnap)
            sleep 15
            note "node 3 killed (docker kill -s KILL) at $(date -u +%T) under load of 3 clients on nodes 1-2"
            docker kill -s KILL srv3 > /dev/null
            if [ "$STORE" = hdfs-ha ]; then
              # NameNode failover under the same load: the active nn2 hands over to nn1 (manual, fenced by
              # shell(/bin/true)); the servers' clients must fail over back to nn1.
              sleep 15
              docker exec nn2 hdfs haadmin -failover nn2 nn1 2>&1 | tail -n 1
              snap1=$(nnSnap)
              note "NameNode failover nn2 -> nn1 at $(date -u +%T): $(haState)"
              # D16: a second failover window (nn1 -> nn2) in the same load, so each run exercises the
              # standby retry (DuckDbAdapter.retryOnStandby) twice.
              sleep 12
              docker exec nn1 hdfs haadmin -failover nn1 nn2 2>&1 | tail -n 1
              snap2=$(nnSnap)
              note "NameNode failover nn1 -> nn2 at $(date -u +%T): $(haState)"
            fi
            wait "$client"; rc=$?
            if [ "$STORE" = hdfs-ha ]; then
              "$py" -I tools/ci/service-cluster-check.py nnreads "$snap0" "${snap1:-?|?}" "${snap2:-?|?}" "$(nnSnap)" > "$RUNNER_TEMP/nn.log"
              while read -r l; do note "$l"; done < <(grep '^NameNode reads' "$RUNNER_TEMP/nn.log")
              # Not a failure (the client checks the answers): queries planned after a failover never reached the new active NameNode.
              w=$(grep -m 1 '^warn ' "$RUNNER_TEMP/nn.log") && echo "::warning title=NameNode not reached::$STORE $CELL: ${w#warn }"
            fi
            grep -E '^(summary|result)' "$RUNNER_TEMP/client.log"
            grep -E '^event .* (unavailable|wrong|error|retry)' "$RUNNER_TEMP/client.log" | head -n 20
            note "$(grep '^summary' "$RUNNER_TEMP/client.log")"
            if [ "$STORE" = hdfs-ha ]; then
              # D16: did the server retry a standby refusal (retried = INFO run=, failed = WARN result=failed),
              # and how many standby refusals reached a log at all? Diagnostic; the client summary decides.
              for i in 1 2 3; do
                l=$(docker logs "srv$i" 2>&1)
                note "srv$i standby: retried $(grep -c 'duckdb=standbyRetry run=' <<< "$l"), retry failed $(grep -c 'duckdb=standbyRetry result=failed' <<< "$l"), standby lines $(grep -c 'in state standby' <<< "$l"); first: $(grep -m 1 'in state standby' <<< "$l" | cut -c1-220)"
              done
            fi
          else
            # D13 (a2): on HDFS the check prints each query's DataNode block reads (local / remote client).
            [[ $STORE == hdfs* ]] && export SC_DATANODES=172.30.0.11:9864,172.30.0.12:9864,172.30.0.13:9864
            # D15: speed-dc also runs the queries with plain table names; they must merge like the qualified ones.
            [ "$CELL" = speed-dc ] && export SC_PLAIN=1
            "$py" -I tools/ci/service-cluster-check.py check "$nodes" "$in" > "$RUNNER_TEMP/client.log" 2>&1; rc=$?
            cat "$RUNNER_TEMP/client.log"
            if [[ $STORE == hdfs* ]]; then
              note "$(grep -m 1 '^reads total' "$RUNNER_TEMP/client.log" || echo 'reads total: (none)')"
              # Partial mode: does each endpoint run on the node holding its files' blocks? Diagnostic only.
              timeout 300 "$py" -I tools/ci/service-cluster-check.py locality "$nodes" "$in" > "$RUNNER_TEMP/locality.log" 2>&1
              cat "$RUNNER_TEMP/locality.log"
              note "$(grep -m 1 '^locality' "$RUNNER_TEMP/locality.log" || echo "locality probe failed: $(tail -n 1 "$RUNNER_TEMP/locality.log" | cut -c1-200)")"
              # Which DataNode holds each lineitem / orders file (replication 1), to read the endpoint lines against.
              for t in lineitem orders; do
                docker exec "$nnc" hdfs fsck "/data/tpch/$t" -files -blocks -locations 2>/dev/null \
                  | awk '/\.parquet /{f=$1} /DatanodeInfoWithStorage/{match($0, /172\.30\.0\.1[1-3]/); print f, "dn" substr($0, RSTART + RLENGTH - 1, 1)}' | sort -u
              done
              # Block hosts as the NameNode names them vs what a server resolves (planning matches them to node hosts).
              dnNames=$(docker exec "$nnc" hdfs dfsadmin -report 2>/dev/null | grep -E '^Hostname:' | awk '{print $2}' | sort | tr '\n' ' ')
              resolved=$(for h in $dnNames; do docker exec srv1 getent hosts "$h" > /dev/null 2>&1 && echo "$h=yes" || echo "$h=no"; done | tr '\n' ' ')
              note "DataNode host names (NameNode report): ${dnNames:-?}; resolvable from srv1: ${resolved:-?}"
            fi
          fi
          for i in 1 2 3; do
            note "srv$i: refused $(docker logs "srv$i" 2>&1 | grep -c 'query=refused'), merged $(docker logs "srv$i" 2>&1 | grep -c 'distributedComplete=merged'), fallback $(docker logs "srv$i" 2>&1 | grep -c 'distributedComplete=fallback'), peerLost $(docker logs "srv$i" 2>&1 | grep -c 'distributedComplete=peerLost')"
          done
          if [[ $STORE == hdfs* ]]; then
            # Short-circuit reads: a client reading a local block over the domain socket opens the block file
            # itself, so the DataNode counts no READ_BLOCK op for it; every block read over TCP is one
            # ReadBlockOpNumOps (split into ReadsFromLocalClient / ReadsFromRemoteClient). ReadBlockOpNumOps ==
            # BlocksRead with short-circuit "on" means the servers never read short-circuit (D13 a, 2026-11-02).
            for i in 1 2 3; do
              jmx=$(curl -fsS --max-time 5 "http://172.30.0.1$i:9864/jmx" 2>/dev/null | grep -oE '"(BlocksRead|ReadBlockOpNumOps|ReadsFromLocalClient|ReadsFromRemoteClient)" : [0-9]+' | tr -d '" ' | sort -u | tr '\n' ' ')
              note "dn$i reads (TCP, from DataNode JMX): ${jmx:-(no JMX)}"
              [ -n "$jmx" ] && [ "$(echo "$jmx" | grep -oE 'BlocksRead:[0-9]+' | cut -d: -f2)" -le "$(echo "$jmx" | grep -oE 'ReadBlockOpNumOps:[0-9]+' | cut -d: -f2)" ] && scUnused=$((${scUnused:-0} + 1))
            done
            # Not a cell failure (answers are right, only speed is lost): a warning while the servers read over TCP
            # although the Java client reads short-circuit in the same layout (D13 a1; core lane, hadoopfs/libhdfs3).
            if [ "$sc" = on ] && [[ ${probe:-} == short-circuit* ]] && [ "${scUnused:-0}" -eq 3 ]; then
              note "short-circuit: supported by the layout (Java probe) but unused by the servers (all block reads over TCP)"
              echo "::warning title=short-circuit unused::$STORE $CELL: the servers read every block over TCP although the Java client reads short-circuit in the same layout"
            fi
          fi
          # Item 43: point queries on node 1 (tools/ci/service-cluster-point.sh); the summary compares q/s.
          if [ "$CELL" = speed ] || [ "$CELL" = speed-dc ]; then
            pout=$(bash tools/ci/service-cluster-point.sh "$py" "$(awk -v s="${{ inputs.sf || '1' }}" 'BEGIN { printf "%d", 1500000 * s }')" "$CELL" "$RUNNER_TEMP"); prc=$?
            while read -r x; do note "$x"; done <<< "$pout"
            [ "$prc" -eq 0 ] || finish fail "$(tail -n 1 <<< "$pout")"
          fi
          # D15: a merge must never fall back because a table was named without its schema.
          for i in 1 2 3; do
            unqualified=$(docker logs "srv$i" 2>&1 | grep 'distributedComplete=fallback' | grep -m 1 'Name the table with its schema' || true)
            [ -z "$unqualified" ] || finish fail "srv$i: plain table name not merged: $(echo "$unqualified" | cut -c1-200)"
          done
          result=$(grep -m 1 '^result ' "$RUNNER_TEMP/client.log")
          if [ "$rc" -eq 0 ] && [ "$result" = "result pass" ]; then finish pass ""; fi
          detail=${result#result fail }
          [ -n "$result" ] || detail="client failed: $(grep -m 1 -E 'Error|Exception' "$RUNNER_TEMP/client.log")"
          finish fail "$detail"

      - name: Cell report
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/result.txt" ] || echo "${{ matrix.store }}|${{ matrix.cell }}|fail|setup failed (see the job log)" > "$RUNNER_TEMP/result.txt"
          cp "$RUNNER_TEMP/notes.txt" "$RUNNER_TEMP/result-notes.txt" 2>/dev/null || : > "$RUNNER_TEMP/result-notes.txt"
          {
            echo "### ${{ matrix.store }} ${{ matrix.cell }}"
            echo '```'; cat "$RUNNER_TEMP/result.txt" "$RUNNER_TEMP/result-notes.txt"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result-${{ matrix.store }}-${{ matrix.cell }}
          path: |
            ${{ runner.temp }}/result.txt
            ${{ runner.temp }}/result-notes.txt
            ${{ runner.temp }}/client.log
            ${{ runner.temp }}/locality.log
            ${{ runner.temp }}/point.txt
            ${{ runner.temp }}/point.log
            ${{ runner.temp }}/srv*.log
            ${{ runner.temp }}/dn*.log
            ${{ runner.temp }}/nn*.log
          retention-days: 7

  summary:
    needs: [prepare, cell]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: result-*
          path: ${{ runner.temp }}/results
      - name: Matrix
        run: |
          set -u
          {
            echo "### Service matrix, cluster: ${{ needs.prepare.outputs.server || 'server not prepared' }} ($GITHUB_SHA)"
            echo
            echo "| store | cell | result | first error |"
            echo "|---|---|---|---|"
            for f in "$RUNNER_TEMP"/results/*/result.txt; do
              [ -f "$f" ] || continue
              IFS='|' read -r store cell status detail < "$f"
              echo "| $store | $cell | $([ "$status" = pass ] && echo pass || echo '**FAIL**') | ${detail:-} |"
            done
            echo
            echo '<details><summary>notes</summary>'
            echo
            echo '```'
            for d in "$RUNNER_TEMP"/results/*/; do echo "[$(basename "$d")]"; cat "$d/result-notes.txt" 2>/dev/null; done
            echo '```'
            echo '</details>'
            # Item 43: point queries, 32 clients on node 1, speed-dc q/s against speed q/s per store.
            echo
            echo "| store | point q/s speed | point q/s speed-dc | dc / speed | p99 speed / dc (ms) |"
            echo "|---|---|---|---|---|"
            : > "$RUNNER_TEMP/point-verdict.txt"
            for store in hdfs hdfs-ha s3; do
              sp=$(cat "$RUNNER_TEMP/results/result-$store-speed/point.txt" 2>/dev/null)
              dc=$(cat "$RUNNER_TEMP/results/result-$store-speed-dc/point.txt" 2>/dev/null)
              q1=$(grep -oE 'qps=[0-9.]+' <<< "$sp" | cut -d= -f2); q2=$(grep -oE 'qps=[0-9.]+' <<< "$dc" | cut -d= -f2)
              p1=$(grep -oE 'p99=[0-9]+' <<< "$sp" | cut -d= -f2); p2=$(grep -oE 'p99=[0-9]+' <<< "$dc" | cut -d= -f2)
              ratio=$(awk -v a="${q1:-0}" -v b="${q2:-0}" 'BEGIN { if (a > 0) printf "%.2f", b / a; else print "?" }')
              echo "| $store | ${q1:-?} | ${q2:-?} | $ratio | ${p1:-?} / ${p2:-?} |"
              # The two cells run on different runners: with the same server work (the speed-dc cell fails
              # itself on any merge or admission wait of a point lookup), their q/s differ by up to ~40 %
              # (main run 42789267919: hdfs 0.62 on code that gave 0.84 on the branch). Below 0.8 warns;
              # below 0.5 (the fan-out cost before item 43: 0.27-0.57) fails.
              if [ "$ratio" = "?" ] || awk -v r="$ratio" 'BEGIN { exit !(r < 0.5) }'; then
                echo "$store: speed-dc point q/s ${q2:-?} below half of speed ${q1:-?} (ratio $ratio)" >> "$RUNNER_TEMP/point-verdict.txt"
              elif awk -v r="$ratio" 'BEGIN { exit !(r < 0.8) }'; then
                echo "$store: speed-dc point q/s ${q2:-?} not within 20 % of speed ${q1:-?} (ratio $ratio; cells on different runners)" >> "$RUNNER_TEMP/point-warn.txt"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          n=$(ls "$RUNNER_TEMP"/results/*/result.txt 2>/dev/null | wc -l)
          [ "$n" -eq 12 ] || { echo "only $n of 12 cells reported"; exit 1; }
          ! grep -h '|fail|' "$RUNNER_TEMP"/results/*/result.txt || exit 1
          [ ! -s "$RUNNER_TEMP/point-warn.txt" ] || while read -r l; do echo "::warning title=item 43 point q/s::$l"; done < "$RUNNER_TEMP/point-warn.txt"
          if [ -s "$RUNNER_TEMP/point-verdict.txt" ]; then
            while read -r l; do echo "::error title=item 43 point q/s::$l"; done < "$RUNNER_TEMP/point-verdict.txt"
            exit 1
          fi
