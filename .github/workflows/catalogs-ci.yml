# Lane 4 (catalogs and sources): conformance of the iceberg plugin's REST path against real
# Iceberg REST catalogs started as containers (RestCatalogConformanceTest, and the answers through
# the server: RestCatalogServerConformanceTest; docs/dev/CATALOGS-STATUS.md item C1). Test-only credentials, generated or fixed for the throw-away containers.
name: Catalogs CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "flight-plugin-iceberg/**"
      - "flight-spi/**"
      - "flight-plugin-s3/**"
      - "flight-plugin-hive/**"
      - "flight-server/src/main/java/pro/surpin/data/arrowflight/server/catalog/**"
      - "flight-server/src/test/java/pro/surpin/data/arrowflight/server/catalog/**"
      - "tools/ci/**"
      - ".github/workflows/catalogs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogs-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --errors --no-transfer-progress
  LC_ALL: C.UTF-8

jobs:
  iceberg-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # <catalog>-s3: the warehouse is an S3 bucket (static keys; the catalog vends none yet).
        # unity-catalog: Unity Catalog OSS, managed Iceberg tables on a local storage root.
        # iceberg-rest-fixture-ozone-s3: as iceberg-rest-fixture-s3, the S3 server is Apache Ozone's
        # S3 gateway instead of moto (C3: Ozone as an S3 backend).
        catalog: [ polaris, iceberg-rest-fixture, polaris-s3, iceberg-rest-fixture-s3, lakekeeper-s3,
                   unity-catalog, iceberg-rest-fixture-ozone-s3 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: DuckDB iceberg/avro extensions (ci-assets, else extensions.duckdb.org)
        env:
          GH_TOKEN: ${{ github.token }}
          DUCKDB_VERSION: v1.5.6
        run: |
          set -euo pipefail
          ext="$RUNNER_TEMP/duckdb-ext"
          mkdir -p "$ext"
          if gh release download ci-assets --repo "$GITHUB_REPOSITORY" \
              --pattern "duckdb-extensions-${DUCKDB_VERSION}.tar.zst" --dir "$RUNNER_TEMP"; then
            tar --zstd -xf "$RUNNER_TEMP/duckdb-extensions-${DUCKDB_VERSION}.tar.zst" -C "$ext"
          else
            dir="$ext/${DUCKDB_VERSION}/linux_amd64"
            mkdir -p "$dir"
            for name in iceberg avro httpfs; do
              curl -fsSL --retry 4 "https://extensions.duckdb.org/${DUCKDB_VERSION}/linux_amd64/${name}.duckdb_extension.gz" \
                | gunzip > "$dir/${name}.duckdb_extension"
            done
          fi
          iceberg=$(find "$ext" -path "*${DUCKDB_VERSION}/linux_amd64/iceberg.duckdb_extension" | head -n 1)
          test -n "$iceberg" || { echo "no ${DUCKDB_VERSION}/linux_amd64/iceberg.duckdb_extension"; exit 1; }
          echo "ICEBERG_EXT_DIR=$(dirname "$(dirname "$(dirname "$iceberg")")")" >> "$GITHUB_ENV"

      # S3 variants: an S3 endpoint on localhost:9000 (moto's server: quay.io/minio/minio refuses
      # anonymous pulls since 2026-10; moto accepts any key, so the keys only travel), bucket
      # "lake"; the catalogs run on the host network and use the same keys (test-only, generated).
      - name: Start S3
        if: endsWith(matrix.catalog, '-s3')
        run: |
          set -euo pipefail
          key=$(openssl rand -hex 8)
          secret=$(openssl rand -hex 16)
          echo "::add-mask::$secret"
          if [[ "${{ matrix.catalog }}" == *-ozone-s3 ]]; then
            # Non-secure Ozone: the gateway accepts any key, as moto.
            tools/ci/ozone-s3.sh apache/ozone:2.0.0 9000
          else
            python3 -m venv "$RUNNER_TEMP/moto"
            "$RUNNER_TEMP/moto/bin/pip" install -q 'moto[server]==5.2.5'
            nohup "$RUNNER_TEMP/moto/bin/moto_server" -H 0.0.0.0 -p 9000 > "$RUNNER_TEMP/s3.log" 2>&1 &
            for _ in $(seq 60); do curl -fsS -o /dev/null http://localhost:9000/ && break; sleep 1; done
          fi
          AWS_ACCESS_KEY_ID=$key AWS_SECRET_ACCESS_KEY=$secret AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://localhost:9000 s3 mb s3://lake
          {
            echo "S3_KEY=$key"
            echo "S3_SECRET=$secret"
            echo "ICEBERG_REST_IT_S3_ENDPOINT=http://localhost:9000"
            echo "ICEBERG_REST_IT_S3_ACCESS_KEY=$key"
            echo "ICEBERG_REST_IT_S3_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"

      # File variants: the catalog's warehouse is a local directory mounted at the same path in the
      # container, so the test (writer and plugin) and the catalog see the same files; the catalog
      # runs as the runner user (the host user database mounted, for Hadoop's login), so the test
      # can write data files into the table directories it creates.
      - name: Start ${{ matrix.catalog }}
        run: |
          set -euo pipefail
          wh="$RUNNER_TEMP/rest-wh"
          mkdir -p "$wh"
          chmod 777 "$wh"
          s3env=(-e "AWS_ACCESS_KEY_ID=${S3_KEY:-}" -e "AWS_SECRET_ACCESS_KEY=${S3_SECRET:-}" -e AWS_REGION=us-east-1)
          case "${{ matrix.catalog }}" in
            polaris)
              secret=$(openssl rand -hex 16)
              echo "::add-mask::$secret"
              docker run -d --name catalog --user "$(id -u):$(id -g)" -v /etc/passwd:/etc/passwd:ro \
                -v /etc/group:/etc/group:ro -p 8181:8181 -v "$wh:$wh" \
                -e "POLARIS_BOOTSTRAP_CREDENTIALS=POLARIS,root,$secret" \
                -e polaris.realm-context.realms=POLARIS \
                -e 'polaris.features."ALLOW_INSECURE_STORAGE_TYPES"=true' \
                -e 'polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"=["FILE"]' \
                -e polaris.readiness.ignore-severe-issues=true \
                apache/polaris:1.2.0-incubating
              tools/ci/polaris-setup.sh http://localhost:8181 root "$secret" conformance "$wh"
              {
                echo "ICEBERG_REST_IT_ROOT=$wh"
                echo "ICEBERG_REST_IT_URI=http://localhost:8181/api/catalog"
                echo "ICEBERG_REST_IT_WAREHOUSE=conformance"
                echo "ICEBERG_REST_IT_CREDENTIAL=root:$secret"
                echo "ICEBERG_REST_IT_SCOPE=PRINCIPAL_ROLE:ALL"
              } >> "$GITHUB_ENV"
              ;;
            polaris-s3)
              secret=$(openssl rand -hex 16)
              echo "::add-mask::$secret"
              docker run -d --name catalog --network host "${s3env[@]}" \
                -e "POLARIS_BOOTSTRAP_CREDENTIALS=POLARIS,root,$secret" \
                -e polaris.realm-context.realms=POLARIS \
                -e polaris.readiness.ignore-severe-issues=true \
                apache/polaris:1.2.0-incubating
              tools/ci/polaris-setup.sh http://localhost:8181 root "$secret" conformance \
                s3://lake/polaris http://localhost:9000
              {
                echo "ICEBERG_REST_IT_ROOT=s3://lake/polaris"
                echo "ICEBERG_REST_IT_URI=http://localhost:8181/api/catalog"
                echo "ICEBERG_REST_IT_WAREHOUSE=conformance"
                echo "ICEBERG_REST_IT_CREDENTIAL=root:$secret"
                echo "ICEBERG_REST_IT_SCOPE=PRINCIPAL_ROLE:ALL"
              } >> "$GITHUB_ENV"
              ;;
            iceberg-rest-fixture)
              docker run -d --name catalog --user "$(id -u):$(id -g)" -v /etc/passwd:/etc/passwd:ro \
                -v /etc/group:/etc/group:ro -p 8181:8181 -v "$wh:$wh" \
                -e "CATALOG_WAREHOUSE=file://$wh" \
                -e CATALOG_IO__IMPL=org.apache.iceberg.hadoop.HadoopFileIO \
                apache/iceberg-rest-fixture:1.10.0
              for _ in $(seq 60); do curl -fsS http://localhost:8181/v1/config && break; sleep 2; done
              echo "ICEBERG_REST_IT_ROOT=$wh" >> "$GITHUB_ENV"
              echo "ICEBERG_REST_IT_URI=http://localhost:8181" >> "$GITHUB_ENV"
              ;;
            iceberg-rest-fixture-s3|iceberg-rest-fixture-ozone-s3)
              docker run -d --name catalog --network host "${s3env[@]}" \
                -e CATALOG_WAREHOUSE=s3://lake/fixture \
                -e CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO \
                -e CATALOG_S3_ENDPOINT=http://localhost:9000 -e CATALOG_S3_PATH__STYLE__ACCESS=true \
                apache/iceberg-rest-fixture:1.10.0
              for _ in $(seq 60); do curl -fsS http://localhost:8181/v1/config && break; sleep 2; done
              echo "ICEBERG_REST_IT_ROOT=s3://lake/fixture" >> "$GITHUB_ENV"
              echo "ICEBERG_REST_IT_URI=http://localhost:8181" >> "$GITHUB_ENV"
              ;;
            unity-catalog)
              # Unity Catalog OSS 0.7: its Iceberg REST endpoint creates managed tables under
              # storage-root.tables. It writes etc/conf, etc/db and etc/logs and its home is only
              # readable by group 101, so it runs as the runner user in that group on writable
              # copies (the H2 database keeps the image's sample catalog "unity"). It refuses Iceberg
              # "time" columns (left out of the fixtures on both sides) and its sample table
              # default.marksheet_uniform cannot be loaded (500), so the server shows namespace ice only.
              image=unitycatalog/unitycatalog:v0.7.0
              uc="$RUNNER_TEMP/uc"
              mkdir -p "$uc/db" "$uc/logs"
              docker create --name uc-seed "$image" > /dev/null
              docker cp uc-seed:/home/unitycatalog/etc/conf "$uc/conf"
              docker cp uc-seed:/home/unitycatalog/etc/db/h2db.mv.db "$uc/db/"
              docker rm uc-seed > /dev/null
              echo "storage-root.tables=file://$wh" >> "$uc/conf/server.properties"
              docker run -d --name catalog --user "$(id -u):101" -v /etc/passwd:/etc/passwd:ro \
                -v /etc/group:/etc/group:ro -p 8080:8080 -v "$wh:$wh" \
                -v "$uc/conf:/home/unitycatalog/etc/conf" -v "$uc/db:/home/unitycatalog/etc/db" \
                -v "$uc/logs:/home/unitycatalog/etc/logs" "$image"
              base=http://localhost:8080/api/2.1/unity-catalog/iceberg
              for _ in $(seq 60); do curl -fsS "$base/v1/config?warehouse=unity" && break; sleep 2; done
              {
                echo "ICEBERG_REST_IT_ROOT=$wh"
                echo "ICEBERG_REST_IT_URI=$base"
                echo "ICEBERG_REST_IT_WAREHOUSE=unity"
                echo "ICEBERG_REST_IT_OMIT_COLUMNS=tm"
                echo "ICEBERG_REST_IT_NAMESPACES=ice"
              } >> "$GITHUB_ENV"
              ;;
            lakekeeper-s3)
              tools/ci/lakekeeper-setup.sh vakamo/lakekeeper:v0.13.8 conformance lake lakekeeper \
                http://localhost:9000 "$S3_KEY" "$S3_SECRET"
              {
                echo "ICEBERG_REST_IT_ROOT=s3://lake/lakekeeper"
                echo "ICEBERG_REST_IT_URI=http://localhost:8181/catalog"
                echo "ICEBERG_REST_IT_WAREHOUSE=conformance"
              } >> "$GITHUB_ENV"
              ;;
          esac

      - name: Conformance test
        run: |
          set -euo pipefail
          ./mvnw install -DskipTests -Dcheckstyle.skip -Dspotbugs.skip -pl flight-plugin-iceberg,flight-server -am
          ./mvnw test -pl flight-plugin-iceberg -Dtest=RestCatalogConformanceTest \
            -Diceberg.it.extensionDir="$ICEBERG_EXT_DIR"
          # A skipped conformance test is a failure here.
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          s = ET.parse("flight-plugin-iceberg/target/surefire-reports/"
                       "TEST-pro.surpin.data.arrowflight.plugin.iceberg.RestCatalogConformanceTest.xml").getroot()
          tests, skipped = int(s.get("tests")), int(s.get("skipped"))
          print(f"conformance: {tests} tests, {skipped} skipped")
          assert tests == 3 and skipped == 0, "conformance tests skipped"
          EOF

      # Answers through the server (partial and complete) vs an iceberg-hadoop reference; on the
      # S3 entries the server reads the warehouse through the s3 plugin.
      - name: Server conformance test
        run: |
          set -euo pipefail
          ./mvnw test -pl flight-server -Dtest=RestCatalogServerConformanceTest \
            -Dsurefire.failIfNoSpecifiedTests=false -Diceberg.it.extensionDir="$ICEBERG_EXT_DIR"
          # The metastore reference runs on local warehouses only (one skip on the S3 entries).
          S3_ENTRY=${{ endsWith(matrix.catalog, '-s3') }} python3 - <<'EOF'
          import os, xml.etree.ElementTree as ET
          s = ET.parse("flight-server/target/surefire-reports/"
                       "TEST-pro.surpin.data.arrowflight.server.catalog.RestCatalogServerConformanceTest.xml").getroot()
          tests, skipped = int(s.get("tests")), int(s.get("skipped"))
          print(f"server conformance: {tests} tests, {skipped} skipped")
          expected = 1 if os.environ["S3_ENTRY"] == "true" else 0
          assert tests == 4 and skipped == expected, "server conformance tests skipped"
          EOF

      - name: Catalog log
        if: failure()
        run: |
          docker logs catalog 2>&1 | tail -200
          tail -100 "$RUNNER_TEMP/uc/logs/"*.log 2>/dev/null || true
          tail -50 "$RUNNER_TEMP/s3.log" 2>/dev/null || true
          for c in ozone-scm ozone-om ozone-dn ozone-s3g; do
            docker logs "$c" 2>/dev/null | tail -60 || true
          done

  # C2 step 1: DuckDB's postgres / mysql scanner extensions under the server's lockdown
  # (tools/ci/DuckDbScannerProbe.java). Records what reads and what client statements get through;
  # fails only when loading, attaching or the plain read fails. Test-only passwords, generated.
  jdbc-scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: DuckDB scanner extensions (ci-assets, else extensions.duckdb.org)
        env:
          GH_TOKEN: ${{ github.token }}
          DUCKDB_VERSION: v1.5.6
        run: |
          set -euo pipefail
          ext="$RUNNER_TEMP/scanner-ext"
          mkdir -p "$ext"
          for name in postgres_scanner mysql_scanner; do
            if ! gh release download ci-assets --repo "$GITHUB_REPOSITORY" \
                --pattern "${name}-${DUCKDB_VERSION}-linux_amd64.duckdb_extension" --dir "$RUNNER_TEMP"; then
              curl -fsSL --retry 4 "https://extensions.duckdb.org/${DUCKDB_VERSION}/linux_amd64/${name}.duckdb_extension.gz" \
                | gunzip > "$RUNNER_TEMP/${name}-${DUCKDB_VERSION}-linux_amd64.duckdb_extension"
            fi
            cp "$RUNNER_TEMP/${name}-${DUCKDB_VERSION}-linux_amd64.duckdb_extension" "$ext/${name}.duckdb_extension"
          done
          ls -l "$ext"
          sha256sum "$ext"/*
          echo "SCANNER_EXT_DIR=$ext" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duckdb-scanner-extensions-v1.5.6
          path: ${{ runner.temp }}/*-v1.5.6-linux_amd64.duckdb_extension
          retention-days: 14

      - name: Start PostgreSQL and MySQL
        run: |
          set -euo pipefail
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=probe -e "POSTGRES_PASSWORD=$pw" \
            -e POSTGRES_DB=probe postgres:16.4
          docker run -d --name mysql -p 3306:3306 -e MYSQL_USER=probe -e "MYSQL_PASSWORD=$pw" \
            -e MYSQL_DATABASE=probe -e "MYSQL_ROOT_PASSWORD=$pw" mysql:8.4
          for _ in $(seq 60); do docker exec pg pg_isready -U probe -d probe && break; sleep 2; done
          docker exec -i -e "PGPASSWORD=$pw" pg psql -v ON_ERROR_STOP=1 -U probe -d probe <<'SQL'
          CREATE TABLE t (id int PRIMARY KEY, name varchar(10));
          INSERT INTO t VALUES (1, 'a'), (2, 'b'), (3, 'c');
          CREATE TABLE types (si smallint, i integer, bi bigint, num numeric(18,4), r real, d double precision,
            b boolean, tx text, vc varchar(10), ch char(3), dt date, ts timestamp, tstz timestamptz, tm time,
            iv interval, u uuid, by bytea, js json, jb jsonb, arr int[]);
          INSERT INTO types VALUES (-1, 2, 3000000000, 12345.6789, 1.5, 2.25, true, 'text', 'vc', 'ch',
            '2024-02-29', '2024-02-29 12:34:56.123456', '2024-02-29 12:34:56+02', '12:34:56', '1 day 2 hours',
            'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11', '\x0102', '{"a":1}', '{"b":2}', '{1,2,3}');
          INSERT INTO types VALUES (NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL,
            NULL, NULL, NULL, NULL, NULL, NULL, NULL);
          SQL
          for _ in $(seq 90); do docker exec mysql mysqladmin ping -uprobe "-p$pw" --silent && break; sleep 2; done
          sleep 5
          docker exec -i mysql mysql -uprobe "-p$pw" probe <<'SQL'
          CREATE TABLE t (id int PRIMARY KEY, name varchar(10));
          INSERT INTO t VALUES (1, 'a'), (2, 'b'), (3, 'c');
          CREATE TABLE types (ti tinyint, si smallint, i int, bi bigint, ubi bigint unsigned, num decimal(18,4),
            f float, d double, bt bit(1), vc varchar(10), ch char(3), tx text, dt date, dtm datetime(6),
            ts timestamp NULL, tm time, yr year, bl blob, js json, en enum('x','y'));
          INSERT INTO types VALUES (-1, 2, 3, 3000000000, 18446744073709551615, 12345.6789, 1.5, 2.25, b'1', 'vc',
            'ch', 'text', '2024-02-29', '2024-02-29 12:34:56.123456', '2024-02-29 12:34:56', '12:34:56', 2024,
            x'0102', '{"a":1}', 'y');
          INSERT INTO types VALUES (NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL,
            NULL, NULL, NULL, NULL, NULL, NULL, NULL);
          SQL
          {
            echo "PROBE_PG_HOST=127.0.0.1"; echo "PROBE_PG_PORT=5432"; echo "PROBE_PG_DATABASE=probe"
            echo "PROBE_PG_USER=probe"; echo "PROBE_PG_PASSWORD=$pw"
            echo "PROBE_MYSQL_HOST=127.0.0.1"; echo "PROBE_MYSQL_PORT=3306"; echo "PROBE_MYSQL_DATABASE=probe"
            echo "PROBE_MYSQL_USER=probe"; echo "PROBE_MYSQL_PASSWORD=$pw"
          } >> "$GITHUB_ENV"

      - name: Probe
        run: |
          set -euo pipefail
          ./mvnw dependency:get -Dartifact=org.duckdb:duckdb_jdbc:1.5.6.0
          java -cp "$HOME/.m2/repository/org/duckdb/duckdb_jdbc/1.5.6.0/duckdb_jdbc-1.5.6.0.jar" \
            tools/ci/DuckDbScannerProbe.java "$SCANNER_EXT_DIR"

      - name: Database logs
        if: failure()
        run: |
          docker logs pg 2>&1 | tail -50
          docker logs mysql 2>&1 | tail -50

  # Item C3 step 1: DuckDB's delta extension under the server's lockdown, on Delta tables written by
  # Spark + delta-spark (tools/ci/delta-fixtures.py: partitions, deletion vectors, column mapping,
  # checkpoints, versions, schema evolution, types), local, on S3 (moto) and on HDFS (single node, read
  # through our hadoopfs build); results in the job summary.
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: DuckDB delta + httpfs extensions (ci-assets, else extensions.duckdb.org)
        env:
          GH_TOKEN: ${{ github.token }}
          DUCKDB_VERSION: v1.5.6
        run: |
          set -euo pipefail
          ext="$RUNNER_TEMP/delta-ext"
          mkdir -p "$ext" "$RUNNER_TEMP/all-ext"
          gh release download ci-assets --repo "$GITHUB_REPOSITORY" \
            --pattern "duckdb-extensions-${DUCKDB_VERSION}.tar.zst" --dir "$RUNNER_TEMP"
          tar --zstd -xf "$RUNNER_TEMP/duckdb-extensions-${DUCKDB_VERSION}.tar.zst" -C "$RUNNER_TEMP/all-ext"
          cp "$(find "$RUNNER_TEMP/all-ext" -path "*${DUCKDB_VERSION}/linux_amd64/httpfs.duckdb_extension" | head -n 1)" \
            "$ext/httpfs.duckdb_extension"
          cp "$(find "$RUNNER_TEMP/all-ext" -path "*${DUCKDB_VERSION}/linux_amd64/hadoopfs.duckdb_extension" | head -n 1)" \
            "$ext/hadoopfs.duckdb_extension"
          name=delta
          if ! gh release download ci-assets --repo "$GITHUB_REPOSITORY" \
              --pattern "${name}-${DUCKDB_VERSION}-linux_amd64.duckdb_extension" --dir "$RUNNER_TEMP"; then
            curl -fsSL --retry 4 "https://extensions.duckdb.org/${DUCKDB_VERSION}/linux_amd64/${name}.duckdb_extension.gz" \
              | gunzip > "$RUNNER_TEMP/${name}-${DUCKDB_VERSION}-linux_amd64.duckdb_extension"
          fi
          cp "$RUNNER_TEMP/${name}-${DUCKDB_VERSION}-linux_amd64.duckdb_extension" "$ext/${name}.duckdb_extension"
          ls -l "$ext"
          sha256sum "$ext"/*
          echo "DELTA_EXT_DIR=$ext" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duckdb-delta-extension-v1.5.6
          path: ${{ runner.temp }}/delta-v1.5.6-linux_amd64.duckdb_extension
          retention-days: 14

      - name: Delta fixtures (Spark 3.5.3 + delta-spark 3.3.2)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/spark"
          "$RUNNER_TEMP/spark/bin/pip" install -q pyspark==3.5.3 delta-spark==3.3.2
          out="$RUNNER_TEMP/delta-fixtures"
          mkdir -p "$out"
          "$RUNNER_TEMP/spark/bin/python" tools/ci/delta-fixtures.py "$out"
          mkdir -p "$RUNNER_TEMP/outside"
          cp -r "$out/t" "$RUNNER_TEMP/outside/t"
          mkdir -p "$RUNNER_TEMP/outside/logonly"
          cp -r "$out/t/_delta_log" "$RUNNER_TEMP/outside/logonly/"
          find "$out" -maxdepth 2 | sort | head -80
          echo "DELTA_FIXTURES=$out" >> "$GITHUB_ENV"
          echo "PROBE_OUTSIDE_DIR=$RUNNER_TEMP/outside" >> "$GITHUB_ENV"

      # moto as in the iceberg-rest job (accepts any key; test-only, generated).
      - name: S3 copy of the fixtures
        run: |
          set -euo pipefail
          key=$(openssl rand -hex 8)
          secret=$(openssl rand -hex 16)
          echo "::add-mask::$secret"
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install -q 'moto[server]==5.2.5'
          nohup "$RUNNER_TEMP/moto/bin/moto_server" -H 0.0.0.0 -p 9000 > "$RUNNER_TEMP/s3.log" 2>&1 &
          for _ in $(seq 60); do curl -fsS -o /dev/null http://localhost:9000/ && break; sleep 1; done
          export AWS_ACCESS_KEY_ID=$key AWS_SECRET_ACCESS_KEY=$secret AWS_DEFAULT_REGION=us-east-1
          aws --endpoint-url http://localhost:9000 s3 mb s3://lake
          aws --endpoint-url http://localhost:9000 s3 cp --recursive --quiet "$DELTA_FIXTURES" s3://lake/delta/
          aws --endpoint-url http://localhost:9000 s3 cp --recursive --quiet "$DELTA_FIXTURES/t" s3://lake/outside/t/
          {
            echo "PROBE_S3_ENDPOINT=localhost:9000"
            echo "PROBE_S3_KEY=$key"
            echo "PROBE_S3_SECRET=$secret"
            echo "PROBE_S3_ROOT=s3://lake/delta/"
            echo "PROBE_S3_OUTSIDE=s3://lake/outside/"
          } >> "$GITHUB_ENV"

      - name: HDFS copy of the fixtures
        run: |
          set -euo pipefail
          tools/ci/hdfs-single.sh "$DELTA_FIXTURES" /delta
          echo "PROBE_HDFS_ROOT=hdfs://localhost:8020/delta/" >> "$GITHUB_ENV"

      # In an Ubuntu 20.04 JDK container: the hadoopfs build links libssl.so.1.1 (not on ubuntu-latest).
      - name: Probe
        run: |
          set -euo pipefail
          ./mvnw dependency:get -Dartifact=org.duckdb:duckdb_jdbc:1.5.6.0
          jar="$HOME/.m2/repository/org/duckdb/duckdb_jdbc/1.5.6.0/duckdb_jdbc-1.5.6.0.jar"
          docker run --rm --network host -v "$RUNNER_TEMP:$RUNNER_TEMP" -v "$PWD/tools/ci:/probe:ro" \
            -v "$jar:/duckdb.jar:ro" -e GITHUB_STEP_SUMMARY -e PROBE_S3_ENDPOINT -e PROBE_S3_KEY \
            -e PROBE_S3_SECRET -e PROBE_S3_ROOT -e PROBE_S3_OUTSIDE -e PROBE_OUTSIDE_DIR -e PROBE_HDFS_ROOT \
            eclipse-temurin:17-jdk-focal bash -c 'apt-get update -qq > /dev/null \
              && apt-get install -y -qq libxml2 > /dev/null \
              && java -cp /duckdb.jar /probe/DuckDbDeltaProbe.java "$0" "$1"' "$DELTA_EXT_DIR" "$DELTA_FIXTURES"
          echo "outside after the probe:"; find "$PROBE_OUTSIDE_DIR" -maxdepth 2 | sort
          echo "fixtures root after the probe:"; ls "$DELTA_FIXTURES"

      - name: S3 and HDFS logs
        if: failure()
        run: |
          tail -50 "$RUNNER_TEMP/s3.log"
          docker exec hdfs bash -c 'tail -30 /var/log/hadoop/*.out' || true

  # C4 step 3 (c): insert-only (MM) tables written by a real Hive 4 (tools/ci/hive-mm-writer.sh:
  # inserts, failed inserts, INSERT OVERWRITE, major / minor compaction, gzip text), then read
  # through the server with the hive plugin against a metastore on the same database
  # (HiveRealWriterIntegrationTest: equal to Hive's own answers, complete and partial).
  hive-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build
        run: ./mvnw install -DskipTests -Dcheckstyle.skip -Dspotbugs.skip -pl flight-plugin-hive,flight-server -am

      - name: Hive 4 writes the tables
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hive-mm"
          tools/ci/hive-mm-writer.sh apache/hive:4.0.1 "$out/wh" "$out/derby" "$out/expected"
          {
            echo "HIVE_MM_IT_URIS=thrift://localhost:9083"
            echo "HIVE_MM_IT_ROOT=$out/wh"
            echo "HIVE_MM_IT_EXPECTED=$out/expected"
          } >> "$GITHUB_ENV"

      - name: Server test
        run: |
          set -euo pipefail
          ./mvnw test -pl flight-server -Dtest=HiveRealWriterIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          s = ET.parse("flight-server/target/surefire-reports/"
                       "TEST-pro.surpin.data.arrowflight.server.catalog.HiveRealWriterIntegrationTest.xml").getroot()
          tests, skipped = int(s.get("tests")), int(s.get("skipped"))
          print(f"hive writer: {tests} tests, {skipped} skipped")
          assert tests == 2 and skipped == 0, "hive writer tests skipped"
          PY

      - name: Hive logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/hive-mm/expected/beeline.err" 2>/dev/null | tail -60 || true
          docker logs hive-mm-hs2 2>&1 | tail -80 || true
          docker logs hive-mm-hms 2>&1 | tail -80 || true
