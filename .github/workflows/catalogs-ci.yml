# Lane 4 (catalogs and sources): conformance of the iceberg plugin's REST path against real
# Iceberg REST catalogs started as containers (RestCatalogConformanceTest, and the answers through
# the server: RestCatalogServerConformanceTest; docs/dev/CATALOGS-STATUS.md item C1). Test-only credentials, generated or fixed for the throw-away containers.
name: Catalogs CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "flight-plugin-iceberg/**"
      - "flight-spi/**"
      - "flight-plugin-s3/**"
      - "flight-plugin-hive/**"
      - "flight-server/src/main/java/pro/surpin/data/arrowflight/server/catalog/**"
      - "flight-server/src/test/java/pro/surpin/data/arrowflight/server/catalog/**"
      - "tools/ci/**"
      - ".github/workflows/catalogs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogs-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --errors --no-transfer-progress
  LC_ALL: C.UTF-8

jobs:
  iceberg-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # <catalog>-s3: the warehouse is an S3 bucket (static keys; the catalog vends none yet).
        # unity-catalog: Unity Catalog OSS, managed Iceberg tables on a local storage root.
        catalog: [ polaris, iceberg-rest-fixture, polaris-s3, iceberg-rest-fixture-s3, lakekeeper-s3,
                   unity-catalog ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: DuckDB iceberg/avro extensions (ci-assets, else extensions.duckdb.org)
        env:
          GH_TOKEN: ${{ github.token }}
          DUCKDB_VERSION: v1.5.6
        run: |
          set -euo pipefail
          ext="$RUNNER_TEMP/duckdb-ext"
          mkdir -p "$ext"
          if gh release download ci-assets --repo "$GITHUB_REPOSITORY" \
              --pattern "duckdb-extensions-${DUCKDB_VERSION}.tar.zst" --dir "$RUNNER_TEMP"; then
            tar --zstd -xf "$RUNNER_TEMP/duckdb-extensions-${DUCKDB_VERSION}.tar.zst" -C "$ext"
          else
            dir="$ext/${DUCKDB_VERSION}/linux_amd64"
            mkdir -p "$dir"
            for name in iceberg avro httpfs; do
              curl -fsSL --retry 4 "https://extensions.duckdb.org/${DUCKDB_VERSION}/linux_amd64/${name}.duckdb_extension.gz" \
                | gunzip > "$dir/${name}.duckdb_extension"
            done
          fi
          iceberg=$(find "$ext" -path "*${DUCKDB_VERSION}/linux_amd64/iceberg.duckdb_extension" | head -n 1)
          test -n "$iceberg" || { echo "no ${DUCKDB_VERSION}/linux_amd64/iceberg.duckdb_extension"; exit 1; }
          echo "ICEBERG_EXT_DIR=$(dirname "$(dirname "$(dirname "$iceberg")")")" >> "$GITHUB_ENV"

      # S3 variants: an S3 endpoint on localhost:9000 (moto's server: quay.io/minio/minio refuses
      # anonymous pulls since 2026-10; moto accepts any key, so the keys only travel), bucket
      # "lake"; the catalogs run on the host network and use the same keys (test-only, generated).
      - name: Start S3
        if: endsWith(matrix.catalog, '-s3')
        run: |
          set -euo pipefail
          key=$(openssl rand -hex 8)
          secret=$(openssl rand -hex 16)
          echo "::add-mask::$secret"
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install -q 'moto[server]==5.2.5'
          nohup "$RUNNER_TEMP/moto/bin/moto_server" -H 0.0.0.0 -p 9000 > "$RUNNER_TEMP/s3.log" 2>&1 &
          for _ in $(seq 60); do curl -fsS -o /dev/null http://localhost:9000/ && break; sleep 1; done
          AWS_ACCESS_KEY_ID=$key AWS_SECRET_ACCESS_KEY=$secret AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://localhost:9000 s3 mb s3://lake
          {
            echo "S3_KEY=$key"
            echo "S3_SECRET=$secret"
            echo "ICEBERG_REST_IT_S3_ENDPOINT=http://localhost:9000"
            echo "ICEBERG_REST_IT_S3_ACCESS_KEY=$key"
            echo "ICEBERG_REST_IT_S3_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"

      # File variants: the catalog's warehouse is a local directory mounted at the same path in the
      # container, so the test (writer and plugin) and the catalog see the same files; the catalog
      # runs as the runner user (the host user database mounted, for Hadoop's login), so the test
      # can write data files into the table directories it creates.
      - name: Start ${{ matrix.catalog }}
        run: |
          set -euo pipefail
          wh="$RUNNER_TEMP/rest-wh"
          mkdir -p "$wh"
          chmod 777 "$wh"
          s3env=(-e "AWS_ACCESS_KEY_ID=${S3_KEY:-}" -e "AWS_SECRET_ACCESS_KEY=${S3_SECRET:-}" -e AWS_REGION=us-east-1)
          case "${{ matrix.catalog }}" in
            polaris)
              secret=$(openssl rand -hex 16)
              echo "::add-mask::$secret"
              docker run -d --name catalog --user "$(id -u):$(id -g)" -v /etc/passwd:/etc/passwd:ro \
                -v /etc/group:/etc/group:ro -p 8181:8181 -v "$wh:$wh" \
                -e "POLARIS_BOOTSTRAP_CREDENTIALS=POLARIS,root,$secret" \
                -e polaris.realm-context.realms=POLARIS \
                -e 'polaris.features."ALLOW_INSECURE_STORAGE_TYPES"=true' \
                -e 'polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"=["FILE"]' \
                -e polaris.readiness.ignore-severe-issues=true \
                apache/polaris:1.2.0-incubating
              tools/ci/polaris-setup.sh http://localhost:8181 root "$secret" conformance "$wh"
              {
                echo "ICEBERG_REST_IT_ROOT=$wh"
                echo "ICEBERG_REST_IT_URI=http://localhost:8181/api/catalog"
                echo "ICEBERG_REST_IT_WAREHOUSE=conformance"
                echo "ICEBERG_REST_IT_CREDENTIAL=root:$secret"
                echo "ICEBERG_REST_IT_SCOPE=PRINCIPAL_ROLE:ALL"
              } >> "$GITHUB_ENV"
              ;;
            polaris-s3)
              secret=$(openssl rand -hex 16)
              echo "::add-mask::$secret"
              docker run -d --name catalog --network host "${s3env[@]}" \
                -e "POLARIS_BOOTSTRAP_CREDENTIALS=POLARIS,root,$secret" \
                -e polaris.realm-context.realms=POLARIS \
                -e polaris.readiness.ignore-severe-issues=true \
                apache/polaris:1.2.0-incubating
              tools/ci/polaris-setup.sh http://localhost:8181 root "$secret" conformance \
                s3://lake/polaris http://localhost:9000
              {
                echo "ICEBERG_REST_IT_ROOT=s3://lake/polaris"
                echo "ICEBERG_REST_IT_URI=http://localhost:8181/api/catalog"
                echo "ICEBERG_REST_IT_WAREHOUSE=conformance"
                echo "ICEBERG_REST_IT_CREDENTIAL=root:$secret"
                echo "ICEBERG_REST_IT_SCOPE=PRINCIPAL_ROLE:ALL"
              } >> "$GITHUB_ENV"
              ;;
            iceberg-rest-fixture)
              docker run -d --name catalog --user "$(id -u):$(id -g)" -v /etc/passwd:/etc/passwd:ro \
                -v /etc/group:/etc/group:ro -p 8181:8181 -v "$wh:$wh" \
                -e "CATALOG_WAREHOUSE=file://$wh" \
                -e CATALOG_IO__IMPL=org.apache.iceberg.hadoop.HadoopFileIO \
                apache/iceberg-rest-fixture:1.10.0
              for _ in $(seq 60); do curl -fsS http://localhost:8181/v1/config && break; sleep 2; done
              echo "ICEBERG_REST_IT_ROOT=$wh" >> "$GITHUB_ENV"
              echo "ICEBERG_REST_IT_URI=http://localhost:8181" >> "$GITHUB_ENV"
              ;;
            iceberg-rest-fixture-s3)
              docker run -d --name catalog --network host "${s3env[@]}" \
                -e CATALOG_WAREHOUSE=s3://lake/fixture \
                -e CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO \
                -e CATALOG_S3_ENDPOINT=http://localhost:9000 -e CATALOG_S3_PATH__STYLE__ACCESS=true \
                apache/iceberg-rest-fixture:1.10.0
              for _ in $(seq 60); do curl -fsS http://localhost:8181/v1/config && break; sleep 2; done
              echo "ICEBERG_REST_IT_ROOT=s3://lake/fixture" >> "$GITHUB_ENV"
              echo "ICEBERG_REST_IT_URI=http://localhost:8181" >> "$GITHUB_ENV"
              ;;
            unity-catalog)
              # Unity Catalog OSS 0.7: its Iceberg REST endpoint creates managed tables under
              # storage-root.tables. It writes etc/conf, etc/db and etc/logs and its home is only
              # readable by group 101, so it runs as the runner user in that group on writable
              # copies (the H2 database keeps the image's sample catalog "unity"). It refuses Iceberg
              # "time" columns (left out of the fixtures on both sides) and its sample table
              # default.marksheet_uniform cannot be loaded (500), so the server shows namespace ice only.
              image=unitycatalog/unitycatalog:v0.7.0
              uc="$RUNNER_TEMP/uc"
              mkdir -p "$uc/db" "$uc/logs"
              docker create --name uc-seed "$image" > /dev/null
              docker cp uc-seed:/home/unitycatalog/etc/conf "$uc/conf"
              docker cp uc-seed:/home/unitycatalog/etc/db/h2db.mv.db "$uc/db/"
              docker rm uc-seed > /dev/null
              echo "storage-root.tables=file://$wh" >> "$uc/conf/server.properties"
              docker run -d --name catalog --user "$(id -u):101" -v /etc/passwd:/etc/passwd:ro \
                -v /etc/group:/etc/group:ro -p 8080:8080 -v "$wh:$wh" \
                -v "$uc/conf:/home/unitycatalog/etc/conf" -v "$uc/db:/home/unitycatalog/etc/db" \
                -v "$uc/logs:/home/unitycatalog/etc/logs" "$image"
              base=http://localhost:8080/api/2.1/unity-catalog/iceberg
              for _ in $(seq 60); do curl -fsS "$base/v1/config?warehouse=unity" && break; sleep 2; done
              {
                echo "ICEBERG_REST_IT_ROOT=$wh"
                echo "ICEBERG_REST_IT_URI=$base"
                echo "ICEBERG_REST_IT_WAREHOUSE=unity"
                echo "ICEBERG_REST_IT_OMIT_COLUMNS=tm"
                echo "ICEBERG_REST_IT_NAMESPACES=ice"
              } >> "$GITHUB_ENV"
              ;;
            lakekeeper-s3)
              tools/ci/lakekeeper-setup.sh vakamo/lakekeeper:v0.13.8 conformance lake lakekeeper \
                http://localhost:9000 "$S3_KEY" "$S3_SECRET"
              {
                echo "ICEBERG_REST_IT_ROOT=s3://lake/lakekeeper"
                echo "ICEBERG_REST_IT_URI=http://localhost:8181/catalog"
                echo "ICEBERG_REST_IT_WAREHOUSE=conformance"
              } >> "$GITHUB_ENV"
              ;;
          esac

      - name: Conformance test
        run: |
          set -euo pipefail
          ./mvnw install -DskipTests -Dcheckstyle.skip -Dspotbugs.skip -pl flight-plugin-iceberg,flight-server -am
          ./mvnw test -pl flight-plugin-iceberg -Dtest=RestCatalogConformanceTest \
            -Diceberg.it.extensionDir="$ICEBERG_EXT_DIR"
          # A skipped conformance test is a failure here.
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          s = ET.parse("flight-plugin-iceberg/target/surefire-reports/"
                       "TEST-pro.surpin.data.arrowflight.plugin.iceberg.RestCatalogConformanceTest.xml").getroot()
          tests, skipped = int(s.get("tests")), int(s.get("skipped"))
          print(f"conformance: {tests} tests, {skipped} skipped")
          assert tests == 3 and skipped == 0, "conformance tests skipped"
          EOF

      # Answers through the server (partial and complete) vs an iceberg-hadoop reference; on the
      # S3 entries the server reads the warehouse through the s3 plugin.
      - name: Server conformance test
        run: |
          set -euo pipefail
          ./mvnw test -pl flight-server -Dtest=RestCatalogServerConformanceTest \
            -Dsurefire.failIfNoSpecifiedTests=false -Diceberg.it.extensionDir="$ICEBERG_EXT_DIR"
          # The metastore reference runs on local warehouses only (one skip on the S3 entries).
          S3_ENTRY=${{ endsWith(matrix.catalog, '-s3') }} python3 - <<'EOF'
          import os, xml.etree.ElementTree as ET
          s = ET.parse("flight-server/target/surefire-reports/"
                       "TEST-pro.surpin.data.arrowflight.server.catalog.RestCatalogServerConformanceTest.xml").getroot()
          tests, skipped = int(s.get("tests")), int(s.get("skipped"))
          print(f"server conformance: {tests} tests, {skipped} skipped")
          expected = 1 if os.environ["S3_ENTRY"] == "true" else 0
          assert tests == 4 and skipped == expected, "server conformance tests skipped"
          EOF

      - name: Catalog log
        if: failure()
        run: |
          docker logs catalog 2>&1 | tail -200
          tail -100 "$RUNNER_TEMP/uc/logs/"*.log 2>/dev/null || true
          tail -50 "$RUNNER_TEMP/s3.log" 2>/dev/null || true
