# Development CI of this fork: one full build per change set (all tests except perf and
# real-services, Checkstyle, SpotBugs) and, on demand, a linux-only server jar + plugins dir +
# runtime libs set published as a pre-release of this repository. Test inputs come from the
# `ci-assets` release.
name: Dev CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "pages/**"
      - "benchmarks/**"
      - "observability/**"
  workflow_dispatch:
    inputs:
      package:
        description: "Also publish a linux-only jar + plugins dir + libs set as a release server-<version>-<sha> (after every service-*.yml run on the commit is green)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --errors --no-transfer-progress
  # Hive tests use partition paths with non-ASCII characters: the JVM needs a UTF-8 file encoding.
  LC_ALL: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: DuckDB extensions (ci-assets, else extensions.duckdb.org)
        env:
          GH_TOKEN: ${{ github.token }}
          DUCKDB_VERSION: v1.5.6
        run: |
          set -euo pipefail
          ext="$RUNNER_TEMP/duckdb-ext"
          mkdir -p "$ext"
          # Prefer the ci-assets set (it also holds our hadoopfs build); until it has one for this
          # DuckDB version, take the official httpfs/iceberg/avro builds.
          if gh release download ci-assets --repo "$GITHUB_REPOSITORY" \
              --pattern "duckdb-extensions-${DUCKDB_VERSION}.tar.zst" --dir "$RUNNER_TEMP"; then
            tar --zstd -xf "$RUNNER_TEMP/duckdb-extensions-${DUCKDB_VERSION}.tar.zst" -C "$ext"
            tools/ci/hadoopfs-pinned.sh "$ext"  # hadoopfs 51b7220-afc4 instead of the set's afc3
          else
            dir="$ext/${DUCKDB_VERSION}/linux_amd64"
            mkdir -p "$dir"
            for name in httpfs iceberg avro; do
              curl -fsSL --retry 4 "https://extensions.duckdb.org/${DUCKDB_VERSION}/linux_amd64/${name}.duckdb_extension.gz" \
                | gunzip > "$dir/${name}.duckdb_extension"
            done
          fi
          find "$ext" -name '*.duckdb_extension' | sort
          # The tests want the directory that holds <version>/linux_amd64/<name>.duckdb_extension.
          iceberg=$(find "$ext" -path "*${DUCKDB_VERSION}/linux_amd64/iceberg.duckdb_extension" | head -n 1)
          httpfs=$(find "$ext" -path "*${DUCKDB_VERSION}/linux_amd64/httpfs.duckdb_extension" | head -n 1)
          test -n "$iceberg" || { echo "no ${DUCKDB_VERSION}/linux_amd64/iceberg.duckdb_extension"; exit 1; }
          test -n "$httpfs" || { echo "no ${DUCKDB_VERSION}/linux_amd64/httpfs.duckdb_extension"; exit 1; }
          echo "ICEBERG_EXT_DIR=$(dirname "$(dirname "$(dirname "$iceberg")")")" >> "$GITHUB_ENV"
          echo "DUCKDB_HTTPFS_EXTENSION=$httpfs" >> "$GITHUB_ENV"
          hadoopfs=$(find "$ext" -path "*${DUCKDB_VERSION}/linux_amd64/hadoopfs.duckdb_extension" | head -n 1)
          if [ -n "$hadoopfs" ]; then
            echo "HADOOPFS_IT=$hadoopfs" >> "$GITHUB_ENV"
          else
            echo "::warning::no hadoopfs extension; the hadoopfs lockdown tests are skipped"
          fi

      # The hadoopfs build links OpenSSL 1.1 (libhdfs3), which the runner does not have: the
      # Ubuntu 20.04 libssl1.1 package goes on LD_LIBRARY_PATH of the build step only. Missing
      # libraries skip the hadoopfs tests with a warning instead of failing the build.
      - name: Libraries of the hadoopfs extension (OpenSSL 1.1, libxml2 2.9)
        if: env.HADOOPFS_IT != ''
        run: |
          set -euo pipefail
          # libssl1.1, and libxml2 2.9 with its ICU (newer runner images ship libxml2.so.16 only).
          # Two mirrors: archive.ubuntu.com reset connections on 2026-11-10 while the Azure mirror answered.
          for deb in o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb \
              libx/libxml2/libxml2_2.9.10+dfsg-5ubuntu0.20.04.10_amd64.deb \
              i/icu/libicu66_66.1-2ubuntu2.1_amd64.deb; do
            got=false
            for mirror in http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu; do
              if curl -fsSL --retry 3 --retry-all-errors --max-time 120 -o "$RUNNER_TEMP/lib.deb" "$mirror/pool/main/$deb"; then
                got=true; break
              fi
              echo "::warning::$deb not fetched from $mirror"
            done
            $got || { echo "::error::$deb not fetched from any mirror"; exit 1; }
            dpkg-deb -x "$RUNNER_TEMP/lib.deb" "$RUNNER_TEMP/hadoopfs-libs"
          done
          libs="$RUNNER_TEMP/hadoopfs-libs/usr/lib/x86_64-linux-gnu"
          missing=$(LD_LIBRARY_PATH="$libs" ldd "$HADOOPFS_IT" | grep "not found" || true)
          if [ -n "$missing" ]; then
            echo "::warning::hadoopfs lockdown tests skipped, libraries missing: $missing"
            echo "HADOOPFS_IT=" >> "$GITHUB_ENV"
          else
            echo "HADOOPFS_LIBS=$libs" >> "$GITHUB_ENV"
          fi

      # MIT klist / kvno read the HDFS ticket cache the server writes (HdfsTicketCacheTest), as libhdfs3 does.
      - name: MIT Kerberos client tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends krb5-user

      # CompressionClientsIntegrationTest: pyarrow Flight (C++) and the ADBC Flight SQL driver (Go)
      # read compressed result streams (item 20 (e)).
      - name: Python clients (pyarrow, ADBC Flight SQL)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet pyarrow==26.0.0 adbc-driver-flightsql==1.13.0 adbc-driver-manager==1.13.0
          echo "PYTHON_IT=$RUNNER_TEMP/py/bin/python" >> "$GITHUB_ENV"

      # GenericFlightClientsIntegrationTest: DuckDB's community airport extension reads plain Flight
      # descriptors (P5). Newest DuckDB with an airport build wins; none skips that test.
      - name: DuckDB airport extension
        run: |
          python3 -m venv "$RUNNER_TEMP/airport"
          py="$RUNNER_TEMP/airport/bin/python"
          for version in 2.0.0 1.5.6 1.4.5; do
            if "$RUNNER_TEMP/airport/bin/pip" install --quiet "duckdb==$version" \
                && "$py" -I -c "import duckdb; c = duckdb.connect(); c.execute('INSTALL airport FROM community'); c.execute('LOAD airport')"; then
              echo "DuckDB $version with airport"
              echo "AIRPORT_IT=$py" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::warning::airport extension not installed; its test is skipped"

      # GenericFlightClientsIntegrationTest: ClickHouse's arrowFlight table function reads plain
      # Flight descriptors (P5). A failed pull skips that test instead of failing the build.
      - name: ClickHouse image
        run: |
          image=clickhouse/clickhouse-server:26.8
          if docker pull -q "$image" || docker pull -q "mirror.gcr.io/$image"; then
            docker image inspect "$image" > /dev/null 2>&1 || image="mirror.gcr.io/$image"
            echo "CLICKHOUSE_IT=$image" >> "$GITHUB_ENV"
          else
            echo "::warning::ClickHouse image not pulled; its test is skipped"
          fi

      - name: Build, all tests (no perf / real-services), Checkstyle, SpotBugs
        env:
          LD_LIBRARY_PATH: ${{ env.HADOOPFS_LIBS }}
        run: >
          ./mvnw clean verify checkstyle:check spotbugs:check
          -DexcludedGroups=perf,real-services
          -Diceberg.it.extensionDir="$ICEBERG_EXT_DIR"
          -Ds3.it.httpfs="$DUCKDB_HTTPFS_EXTENSION"
          -Dpython.it.executable="$PYTHON_IT"
          -Dclickhouse.it.image="$CLICKHOUSE_IT"
          -Dairport.it.python="$AIRPORT_IT"
          -Dhadoopfs.it.extension="$HADOOPFS_IT"

      # Item 35: concurrent distributed complete answers on one node, as on the maintainer's benchmark
      # rehearsal (local Parquet SF1, -Xmx2g -XX:MaxDirectMemorySize=2g, speed + distributedComplete):
      # 16 full scans + 32 small queries at once must all be exact, with no failed execution in the
      # server log. 16 scans, not the stand's 8: on a 4-core runner 8 passed even before the fix
      # (the stand has more cores), 16 failed with the stand's "memory limit" INVALID_ARGUMENT.
      # The data generator takes a DuckDB wheel only (duckdb 1.4.1 has none for the runner's Python
      # and compiled from source for 12-15 min, which ran the job into its timeout).
      - name: Distributed complete under concurrency (items 35, 39 (d))
        timeout-minutes: 15
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/dc35"; mkdir -p "$work/data/tpch/lineitem"
          "$RUNNER_TEMP/py/bin/pip" install --quiet --only-binary=duckdb duckdb==1.5.6
          "$RUNNER_TEMP/py/bin/python" -I -c "
          import duckdb, sys
          c = duckdb.connect(); c.execute('INSTALL tpch; LOAD tpch; CALL dbgen(sf=1)')
          for f in range(8):
              c.execute(f\"COPY (SELECT * FROM lineitem WHERE l_orderkey % 8 = {f}) TO '{sys.argv[1]}/part-{f}.parquet' (FORMAT PARQUET)\")
          " "$work/data/tpch/lineitem"
          ./mvnw -B -q -pl flight-server dependency:build-classpath -Dmdep.outputFile="$work/cp.txt" -Dmdep.includeScope=runtime
          # 8g: the maintainer's cluster (item 39 (d)) - 64 streams were admitted into a 2 GiB allocator.
          for direct in 2g 8g; do
            FLIGHT_ALLOW_INSECURE=true LANG=C.UTF-8 java -Xmx2g -XX:MaxDirectMemorySize="$direct" \
              --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED \
              --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED \
              -Dio.netty.tryReflectionSetAccessible=true -Dhazelcast.phone.home.enabled=false \
              -DresourceProfile=speed -DdistributedComplete=true -DresultMode=complete \
              -cp "flight-server/target/arrow-flight-server-1.0.0-shaded.jar:$(cat "$work/cp.txt")" \
              pro.surpin.data.arrowflight.server.HadoopArrowFlightServer --data-dir "$work/data" \
              --localhost 127.0.0.1 --port 32010 --hazelcast-port 5701 --hosts 127.0.0.1:5701 \
              --metrics-enabled false > "$work/server-$direct.log" 2>&1 &
            server=$!
            for _ in $(seq 120); do grep -q 'Server Arrow Flight SQL started' "$work/server-$direct.log" && break; sleep 1; done
            grep -q 'Server Arrow Flight SQL started' "$work/server-$direct.log" || { tail -n 40 "$work/server-$direct.log"; exit 1; }
            grep -m 1 'distributedComplete peer streams' "$work/server-$direct.log" || true
            # Item 39 (d): the streams are read into the 2 GiB Arrow allocator whatever direct memory says.
            grep -q 'distributedComplete peer streams: 16 ' "$work/server-$direct.log" \
              || { echo "peer stream budget is not 16 with direct $direct"; exit 1; }
            rc=0
            "$RUNNER_TEMP/py/bin/python" -I tools/ci/distributed-concurrency-check.py 127.0.0.1:32010 \
              "$work/data/tpch/lineitem" 16 32 > "$work/client-$direct.log" 2>&1 || rc=$?
            grep -v '^  warnings.warn\|Warning: Cannot disable autocommit' "$work/client-$direct.log"
            kill "$server" || true
            wait "$server" || true
            failed=$(grep -c 'execution=failed' "$work/server-$direct.log" || true)
            merged=$(grep -c 'distributedComplete=merged' "$work/server-$direct.log" || true)
            fallback=$(grep -c 'distributedComplete=fallback' "$work/server-$direct.log" || true)
            waits=$(grep -c 'distributedComplete=admissionWait' "$work/server-$direct.log" || true)
            echo "item 35 (direct $direct): $(grep -m 1 '^done' "$work/client-$direct.log"); merged $merged, fallback $fallback, admission waits $waits, failed executions $failed" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$failed" -eq 0 ] || { grep -m 3 'execution=failed' "$work/server-$direct.log" | cut -c1-400; exit 1; }
            [ "$merged" -ge 48 ] || { echo "only $merged of 48 answers merged from endpoint answers"; exit 1; }
            [ "$rc" -eq 0 ] || exit "$rc"
          done

      # Item 39 (b): on the maintainer's cluster a speed server in a 48 GB systemd scope on a 754 GB host sized
      # DuckDB from the host's memory (only /sys/fs/cgroup/memory.max at the mount point was read) and was
      # OOM-killed on a large aggregate. Here: a speed server in a systemd scope with MemoryMax=3G (the runner has
      # 16 GB), an aggregate whose hash table (100 M groups) is larger than the scope: the start log must name the
      # scope's limit, the answer must be exact and the scope must see no OOM kill (DuckDB spills instead).
      - name: Server in a memory-limited systemd scope (item 39 (b))
        timeout-minutes: 12
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/m39"; mkdir -p "$work/data/big/events" "$work/tmp"
          "$RUNNER_TEMP/py/bin/pip" install --quiet --only-binary=duckdb duckdb==1.5.6
          "$RUNNER_TEMP/py/bin/python" -I -c "
          import duckdb, sys
          duckdb.connect().execute(f\"COPY (SELECT i AS id, i % 7 AS g FROM range(100000000) t(i)) TO '{sys.argv[1]}/part-0.parquet' (FORMAT PARQUET)\")
          " "$work/data/big/events"
          ls -l "$work/data/big/events"
          cp "$RUNNER_TEMP/dc35/cp.txt" "$work/cp.txt" 2>/dev/null || true
          [ -s "$work/cp.txt" ] || ./mvnw -B -q -pl flight-server dependency:build-classpath -Dmdep.outputFile="$work/cp.txt" -Dmdep.includeScope=runtime
          sudo systemd-run --quiet --scope --unit=flight39 -p MemoryMax=3G -p MemorySwapMax=0 \
            --uid="$(id -u)" --gid="$(id -g)" \
            env HOME="$HOME" LANG=C.UTF-8 FLIGHT_ALLOW_INSECURE=true "$JAVA_HOME/bin/java" -Xmx512m -XX:MaxDirectMemorySize=512m \
            --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED \
            --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED \
            -Dio.netty.tryReflectionSetAccessible=true -Dhazelcast.phone.home.enabled=false \
            -DresourceProfile=speed -DresultMode=complete -DduckDbTempDirectory="$work/tmp" \
            -cp "flight-server/target/arrow-flight-server-1.0.0-shaded.jar:$(cat "$work/cp.txt")" \
            pro.surpin.data.arrowflight.server.HadoopArrowFlightServer --data-dir "$work/data" \
            --localhost 127.0.0.1 --port 32011 --hazelcast-port 5711 --hosts 127.0.0.1:5711 \
            --metrics-enabled false > "$work/server.log" 2>&1 &
          for _ in $(seq 120); do grep -q 'Server Arrow Flight SQL started' "$work/server.log" && break; sleep 1; done
          grep -q 'Server Arrow Flight SQL started' "$work/server.log" || { tail -n 40 "$work/server.log"; exit 1; }
          scope=/sys/fs/cgroup/system.slice/flight39.scope
          budget=$(grep -m 1 -o 'memoryBudget .*' "$work/server.log" || true)
          sizing=$(grep -m 1 -o 'duckdb=sizing.*' "$work/server.log" | cut -c1-300 || true)
          echo "item 39 (b): $budget | $sizing" | tee -a "$GITHUB_STEP_SUMMARY"
          rc=0
          "$RUNNER_TEMP/py/bin/python" -I -c "
          import sys, time
          import adbc_driver_flightsql.dbapi as flightsql
          t = time.time()
          with flightsql.connect('grpc://127.0.0.1:32011', db_kwargs={'adbc.flight.sql.rpc.call_header.x-flight-result-mode': 'complete'}) as c, c.cursor() as cur:
              cur.execute('SELECT count(*) AS n, sum(c) AS s, max(c) AS m FROM (SELECT id, count(*) AS c FROM big.events GROUP BY id)')
              row = cur.fetchall()[0]
          print('answer', row, 'seconds', round(time.time() - t, 1))
          sys.exit(0 if tuple(int(v) for v in row) == (100000000, 100000000, 1) else 1)
          " > "$work/client.log" 2>&1 || rc=$?
          cat "$work/client.log" | grep -v 'warnings.warn' | tail -n 5
          peak=$(cat "$scope/memory.peak" 2>/dev/null || echo unknown)
          kills=$(awk '$1 == "oom_kill" {print $2}' "$scope/memory.events" 2>/dev/null || echo unknown)
          spilled=$(du -sm "$work/tmp" 2>/dev/null | cut -f1 || true)
          echo "item 39 (b): $(grep -m 1 '^answer' "$work/client.log" || echo 'no answer'); scope peak $peak bytes, oom_kill $kills" | tee -a "$GITHUB_STEP_SUMMARY"
          sudo systemctl stop flight39.scope || true
          echo "$budget" | grep -q 'source=cgroup memoryMiB=3072' || { echo "memory budget not from the scope: $budget"; exit 1; }
          [ "$kills" = "0" ] || { echo "the scope saw OOM kills: $kills"; tail -n 30 "$work/server.log"; exit 1; }
          [ "$rc" -eq 0 ] || { tail -n 30 "$work/server.log" | cut -c1-400; exit 1; }

      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows, total = {}, [0, 0, 0, 0]
          for f in glob.glob("*/target/surefire-reports/TEST-*.xml"):
              s = ET.parse(f).getroot()
              mod = f.split("/")[0]
              r = rows.setdefault(mod, [0, 0, 0, 0])
              for i, k in enumerate(("tests", "failures", "errors", "skipped")):
                  r[i] += int(s.get(k, 0))
                  total[i] += int(s.get(k, 0))
          print("| module | tests | failures | errors | skipped |\n|---|---|---|---|---|")
          for mod, r in sorted(rows.items()):
              print(f"| {mod} | " + " | ".join(map(str, r)) + " |")
          print("| **total** | " + " | ".join(map(str, total)) + " |")
          EOF

      - name: Surefire reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: "*/target/surefire-reports/"
          retention-days: 7
          if-no-files-found: ignore

  # SERVICE MATRIX gate (item 25): the pre-release is published only when the latest run of every
  # service-*.yml on this commit is green; missing (or cancelled) runs are dispatched on this branch
  # and waited for (tools/ci/service-gate.sh).
  service-gate:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.package
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for every service matrix workflow on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/service-gate.sh "$GITHUB_SHA" "$GITHUB_REF_NAME" 180

  package:
    needs: [build, service-gate]
    if: github.event_name == 'workflow_dispatch' && inputs.package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Linux-only jar, plugins and libs set (tests ran in the build job)
        run: ./mvnw clean package -Plinux-only -DskipTests

      - name: Assemble release assets
        run: |
          set -euo pipefail
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          sha=$(git rev-parse --short=12 HEAD)
          tag="server-${version}-${sha}"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp "flight-server/target/arrow-flight-server-${version}-shaded.jar" \
            "$out/arrow-flight-server-${version}-${sha}-linux.jar"
          # LZ4 codec for Java Flight clients (put before arrow-compression, with lz4-java).
          cp "flight-codec-lz4/target/arrow-flight-codec-lz4-${version}.jar" \
            "$out/arrow-flight-codec-lz4-${version}.jar"
          tools/make-plugin-dir.sh "$RUNNER_TEMP/pd" s3 lakefs iceberg hive jdbc
          # Hadoop client libraries the shaded jar leaves to the deployment (flight-server target/libs,
          # checked by LibsSetTest in the build job): java -cp '<jar>:libs/*'.
          mkdir -p "$RUNNER_TEMP/ld/libs"
          cp flight-server/target/libs/*.jar "$RUNNER_TEMP/ld/libs/"
          sed -n 's/^   \([^ ]*\).*/\1/p' flight-server/target/libs-dependencies.txt > "$RUNNER_TEMP/ld/libs/DEPENDENCIES.txt"
          (cd "$RUNNER_TEMP/ld/libs" && sha256sum -- *.jar > SHA256SUMS)
          tar -C "$RUNNER_TEMP/ld" -cf - libs | zstd -19 -T0 > "$out/flight-server-libs-${version}-${sha}.tar.zst"
          tar -C "$RUNNER_TEMP/pd" -cf - plugins | zstd -19 -T0 > "$out/flight-plugins-${version}-${sha}.tar.zst"
          # Optional authentication providers, for the server class path (java -cp '<jar>:libs/*:auth/ldap/*').
          for provider in ldap jwt ranger-hive; do
            mkdir -p "$RUNNER_TEMP/ad/auth/$provider"
            cp "flight-auth-$provider/target/arrow-flight-auth-$provider-${version}.jar" "$RUNNER_TEMP/ad/auth/$provider/"
            # ranger-hive has no own libraries (Ranger and Hadoop come with the server).
            if [ -d "flight-auth-$provider/target/auth-libs" ]; then
              cp flight-auth-$provider/target/auth-libs/*.jar "$RUNNER_TEMP/ad/auth/$provider/"
            fi
            (cd "$RUNNER_TEMP/ad/auth/$provider" && sha256sum -- *.jar > SHA256SUMS)
          done
          tar -C "$RUNNER_TEMP/ad" -cf - auth | zstd -19 -T0 > "$out/flight-auth-${version}-${sha}.tar.zst"
          sed -e "s/@VERSION@/${version}/g" -e "s/@SHA@/${sha}/g" -e "s/@COMMIT@/$(git rev-parse HEAD)/g" \
            docs/dev/START-NOTES.md > "$out/START-NOTES.md"
          (cd "$out" && sha256sum -- * > SHA256SUMS)
          ls -l "$out"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT"/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$OUT"/* --repo "$GITHUB_REPOSITORY" --prerelease \
              --target "$GITHUB_SHA" --title "$TAG" --notes-file "$OUT/START-NOTES.md"
          fi
